apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gitops-platform.fullname" . }}-metrics-aggregator
  labels:
    {{- include "gitops-platform.labels" . | nindent 4 }}
    component: metrics-aggregator
spec:
  replicas: {{ .Values.metricsAggregator.replicaCount }}
  selector:
    matchLabels:
      {{- include "gitops-platform.selectorLabels" . | nindent 6 }}
      component: metrics-aggregator
  template:
    metadata:
      labels:
        {{- include "gitops-platform.selectorLabels" . | nindent 8 }}
        component: metrics-aggregator
    spec:
      containers:
      - name: metrics-aggregator
        image: "{{ .Values.metricsAggregator.image.repository }}:{{ .Values.metricsAggregator.image.tag }}"
        ports:
        - containerPort: 8000
        resources:
          {{- toYaml .Values.metricsAggregator.resources | nindent 10 }}
