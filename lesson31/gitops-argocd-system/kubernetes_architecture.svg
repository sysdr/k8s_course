<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" style="background-color: white;">
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
    
    <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2196F3" />
    </marker>
    
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4CAF50" />
    </marker>
    
    <marker id="arroworange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#FF9800" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="700" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a237e">
    GitOps Architecture with ArgoCD
  </text>
  
  <text x="700" y="65" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666">
    Production-Grade Declarative Deployment Pipeline
  </text>

  <!-- Git Repository -->
  <g transform="translate(50, 120)">
    <rect width="280" height="180" rx="8" fill="#E3F2FD" stroke="#2196F3" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="280" height="40" rx="8" fill="#2196F3"/>
    <text x="140" y="27" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
      Git Repository
    </text>
    
    <text x="20" y="70" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1565C0">
      Source of Truth
    </text>
    
    <rect x="20" y="80" width="240" height="30" rx="4" fill="white" stroke="#2196F3" stroke-width="1"/>
    <text x="30" y="100" font-family="Arial, sans-serif" font-size="11" fill="#333">
      📁 apps/base/deployment.yaml
    </text>
    
    <rect x="20" y="118" width="240" height="30" rx="4" fill="white" stroke="#2196F3" stroke-width="1"/>
    <text x="30" y="138" font-family="Arial, sans-serif" font-size="11" fill="#333">
      📁 apps/overlays/prod/...
    </text>
    
    <rect x="20" y="156" width="240" height="30" rx="4" fill="white" stroke="#2196F3" stroke-width="1"/>
    <text x="30" y="176" font-family="Arial, sans-serif" font-size="11" fill="#333">
      📁 argocd-apps/prod-app.yaml
    </text>
    
    <text x="140" y="210" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666" font-style="italic">
      Declarative K8s Manifests
    </text>
  </g>

  <!-- ArgoCD Controller -->
  <g transform="translate(450, 120)">
    <rect width="300" height="320" rx="8" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="300" height="40" rx="8" fill="#4CAF50"/>
    <text x="150" y="27" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
      ArgoCD Control Plane
    </text>
    
    <!-- Application Controller -->
    <rect x="20" y="60" width="260" height="70" rx="6" fill="white" stroke="#4CAF50" stroke-width="1.5"/>
    <text x="150" y="82" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2E7D32">
      Application Controller
    </text>
    <text x="150" y="100" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">
      Reconciliation Loop (3 min)
    </text>
    <text x="150" y="115" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#999">
      Polls Git → Compares State → Syncs
    </text>
    
    <!-- API Server -->
    <rect x="20" y="145" width="260" height="50" rx="6" fill="white" stroke="#4CAF50" stroke-width="1.5"/>
    <text x="150" y="167" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2E7D32">
      API Server
    </text>
    <text x="150" y="185" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">
      gRPC / REST / WebUI
    </text>
    
    <!-- Repo Server -->
    <rect x="20" y="210" width="260" height="50" rx="6" fill="white" stroke="#4CAF50" stroke-width="1.5"/>
    <text x="150" y="232" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2E7D32">
      Repo Server
    </text>
    <text x="150" y="250" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">
      Git Clone, Manifest Rendering
    </text>
    
    <!-- Redis Cache -->
    <rect x="20" y="275" width="260" height="50" rx="6" fill="white" stroke="#4CAF50" stroke-width="1.5"/>
    <text x="150" y="297" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2E7D32">
      Redis Cache
    </text>
    <text x="150" y="315" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">
      Cluster State Caching
    </text>
  </g>

  <!-- Kubernetes Cluster -->
  <g transform="translate(870, 120)">
    <rect width="480" height="580" rx="8" fill="#FFF3E0" stroke="#FF9800" stroke-width="3" filter="url(#shadow)"/>
    <rect x="0" y="0" width="480" height="40" rx="8" fill="#FF9800"/>
    <text x="240" y="27" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
      Kubernetes Cluster (Production)
    </text>
    
    <!-- Namespace: gitops-apps-prod -->
    <rect x="20" y="60" width="440" height="260" rx="6" fill="white" stroke="#FF9800" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="30" y="80" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#E65100">
      Namespace: gitops-apps-prod
    </text>
    
    <!-- Metrics Aggregator -->
    <g transform="translate(40, 95)">
      <rect width="180" height="80" rx="5" fill="#E3F2FD" stroke="#2196F3" stroke-width="1.5"/>
      <text x="90" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1565C0">
        Metrics Aggregator
      </text>
      <text x="90" y="38" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">
        Deployment (3 replicas)
      </text>
      <text x="90" y="53" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">
        HPA: 2-10 pods
      </text>
      <text x="90" y="68" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#999">
        Polls ArgoCD API
      </text>
    </g>
    
    <!-- Event Processor -->
    <g transform="translate(240, 95)">
      <rect width="180" height="80" rx="5" fill="#E3F2FD" stroke="#2196F3" stroke-width="1.5"/>
      <text x="90" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1565C0">
        Event Processor
      </text>
      <text x="90" y="38" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">
        Deployment (3 replicas)
      </text>
      <text x="90" y="53" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">
        HPA: 2-10 pods
      </text>
      <text x="90" y="68" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#999">
        Webhooks + PostgreSQL
      </text>
    </g>
    
    <!-- Dashboard -->
    <g transform="translate(40, 195)">
      <rect width="180" height="80" rx="5" fill="#E3F2FD" stroke="#2196F3" stroke-width="1.5"/>
      <text x="90" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1565C0">
        Dashboard UI
      </text>
      <text x="90" y="38" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">
        Deployment (2 replicas)
      </text>
      <text x="90" y="53" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">
        React + Nginx
      </text>
      <text x="90" y="68" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#999">
        LoadBalancer Service
      </text>
    </g>
    
    <!-- PostgreSQL -->
    <g transform="translate(240, 195)">
      <rect width="180" height="80" rx="5" fill="#E1F5FE" stroke="#03A9F4" stroke-width="1.5"/>
      <text x="90" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#01579B">
        PostgreSQL
      </text>
      <text x="90" y="38" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">
        StatefulSet (1 replica)
      </text>
      <text x="90" y="53" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">
        PVC: 10Gi
      </text>
      <text x="90" y="68" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#999">
        Deployment History Store
      </text>
    </g>
    
    <!-- Istio Service Mesh -->
    <rect x="20" y="340" width="440" height="90" rx="6" fill="#F3E5F5" stroke="#9C27B0" stroke-width="2"/>
    <text x="30" y="365" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#6A1B9A">
      Istio Service Mesh
    </text>
    <text x="30" y="385" font-family="Arial, sans-serif" font-size="10" fill="#666">
      ✓ mTLS encryption
    </text>
    <text x="30" y="403" font-family="Arial, sans-serif" font-size="10" fill="#666">
      ✓ Traffic management (VirtualService, DestinationRule)
    </text>
    <text x="30" y="421" font-family="Arial, sans-serif" font-size="10" fill="#666">
      ✓ Observability (Distributed tracing)
    </text>
    
    <!-- Monitoring Stack -->
    <rect x="20" y="450" width="440" height="110" rx="6" fill="#E8EAF6" stroke="#3F51B5" stroke-width="2"/>
    <text x="30" y="475" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#283593">
      Monitoring Stack (Namespace: monitoring)
    </text>
    
    <g transform="translate(40, 490)">
      <rect width="125" height="50" rx="4" fill="white" stroke="#3F51B5" stroke-width="1"/>
      <text x="62" y="20" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#283593">
        Prometheus
      </text>
      <text x="62" y="35" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#666">
        Metrics Collection
      </text>
    </g>
    
    <g transform="translate(180, 490)">
      <rect width="125" height="50" rx="4" fill="white" stroke="#3F51B5" stroke-width="1"/>
      <text x="62" y="20" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#283593">
        Grafana
      </text>
      <text x="62" y="35" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#666">
        Visualization
      </text>
    </g>
    
    <g transform="translate(320, 490)">
      <rect width="125" height="50" rx="4" fill="white" stroke="#3F51B5" stroke-width="1"/>
      <text x="62" y="20" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#283593">
        Alertmanager
      </text>
      <text x="62" y="35" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#666">
        Alert Routing
      </text>
    </g>
    
    <!-- Resource Scaling -->
    <text x="240" y="590" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#E65100" font-style="italic">
      ⚡ HPA: Auto-scaling 2-10 pods based on CPU/Memory
    </text>
  </g>

  <!-- Arrows and Flow -->
  
  <!-- Git to ArgoCD -->
  <path d="M 330 210 L 450 210" stroke="#2196F3" stroke-width="3" fill="none" marker-end="url(#arrowblue)"/>
  <text x="390" y="200" font-family="Arial, sans-serif" font-size="10" fill="#2196F3" font-weight="bold">
    Poll every 3min
  </text>
  
  <!-- ArgoCD to K8s -->
  <path d="M 750 280 L 870 280" stroke="#4CAF50" stroke-width="3" fill="none" marker-end="url(#arrowgreen)"/>
  <text x="810" y="270" font-family="Arial, sans-serif" font-size="10" fill="#4CAF50" font-weight="bold">
    kubectl apply
  </text>
  <text x="795" y="300" font-family="Arial, sans-serif" font-size="9" fill="#666">
    (Automated Sync)
  </text>
  
  <!-- K8s to ArgoCD (State feedback) -->
  <path d="M 870 320 L 750 320" stroke="#FF9800" stroke-width="2" fill="none" marker-end="url(#arroworange)" stroke-dasharray="5,3"/>
  <text x="780" y="340" font-family="Arial, sans-serif" font-size="9" fill="#FF9800">
    Cluster State (Watch)
  </text>
  
  <!-- ArgoCD to Metrics Aggregator -->
  <path d="M 600 440 L 600 500 L 950 500" stroke="#2196F3" stroke-width="2" fill="none" marker-end="url(#arrowblue)" stroke-dasharray="5,3"/>
  <text x="700" y="492" font-family="Arial, sans-serif" font-size="9" fill="#2196F3">
    Metrics API (Poll)
  </text>
  
  <!-- Developer Workflow -->
  <g transform="translate(50, 750)">
    <rect width="700" height="180" rx="8" fill="#FAFAFA" stroke="#9E9E9E" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="700" height="35" rx="8" fill="#607D8B"/>
    <text x="350" y="23" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      GitOps Workflow: Developer Experience
    </text>
    
    <g transform="translate(20, 55)">
      <circle cx="20" cy="20" r="18" fill="#4CAF50" stroke="#2E7D32" stroke-width="2"/>
      <text x="20" y="26" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">1</text>
      <text x="50" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">
        Developer commits to Git
      </text>
      <text x="50" y="36" font-family="Arial, sans-serif" font-size="9" fill="#666">
        $ git commit -m "Scale replicas to 5"
      </text>
    </g>
    
    <g transform="translate(220, 55)">
      <circle cx="20" cy="20" r="18" fill="#2196F3" stroke="#1565C0" stroke-width="2"/>
      <text x="20" y="26" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">2</text>
      <text x="50" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">
        ArgoCD detects change
      </text>
      <text x="50" y="36" font-family="Arial, sans-serif" font-size="9" fill="#666">
        Reconciliation loop (within 3 min)
      </text>
    </g>
    
    <g transform="translate(420, 55)">
      <circle cx="20" cy="20" r="18" fill="#FF9800" stroke="#E65100" stroke-width="2"/>
      <text x="20" y="26" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">3</text>
      <text x="50" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">
        Automated sync to cluster
      </text>
      <text x="50" y="36" font-family="Arial, sans-serif" font-size="9" fill="#666">
        kubectl apply (no manual intervention)
      </text>
    </g>
    
    <g transform="translate(20, 105)">
      <circle cx="20" cy="20" r="18" fill="#9C27B0" stroke="#6A1B9A" stroke-width="2"/>
      <text x="20" y="26" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">4</text>
      <text x="50" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">
        Self-healing enabled
      </text>
      <text x="50" y="36" font-family="Arial, sans-serif" font-size="9" fill="#666">
        Reverts manual kubectl edits
      </text>
    </g>
    
    <g transform="translate(220, 105)">
      <circle cx="20" cy="20" r="18" fill="#F44336" stroke="#C62828" stroke-width="2"/>
      <text x="20" y="26" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">5</text>
      <text x="50" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">
        Metrics & observability
      </text>
      <text x="50" y="36" font-family="Arial, sans-serif" font-size="9" fill="#666">
        Real-time dashboard updates
      </text>
    </g>
    
    <g transform="translate(420, 105)">
      <circle cx="20" cy="20" r="18" fill="#00BCD4" stroke="#0097A7" stroke-width="2"/>
      <text x="20" y="26" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">6</text>
      <text x="50" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">
        Complete audit trail
      </text>
      <text x="50" y="36" font-family="Arial, sans-serif" font-size="9" fill="#666">
        Git history = deployment history
      </text>
    </g>
  </g>

  <!-- Key Principles -->
  <g transform="translate(870, 750)">
    <rect width="480" height="180" rx="8" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="480" height="35" rx="8" fill="#4CAF50"/>
    <text x="240" y="23" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      GitOps Principles
    </text>
    
    <g transform="translate(20, 50)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2E7D32">
        ✓ Declarative Infrastructure
      </text>
      <text x="20" y="18" font-family="Arial, sans-serif" font-size="9" fill="#666">
        All config stored in Git (YAML manifests)
      </text>
      
      <text x="0" y="45" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2E7D32">
        ✓ Version Control as Single Source of Truth
      </text>
      <text x="20" y="63" font-family="Arial, sans-serif" font-size="9" fill="#666">
        Git commits = production deployments
      </text>
      
      <text x="0" y="90" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2E7D32">
        ✓ Automated Synchronization
      </text>
      <text x="20" y="108" font-family="Arial, sans-serif" font-size="9" fill="#666">
        ArgoCD continuously reconciles desired vs actual state
      </text>
      
      <text x="0" y="135" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2E7D32">
        ✓ Self-Healing & Drift Detection
      </text>
      <text x="20" y="153" font-family="Arial, sans-serif" font-size="9" fill="#666">
        Automatic rollback of unauthorized changes
      </text>
    </g>
  </g>

  <!-- Footer with scale info -->
  <text x="700" y="970" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">
    Production Scale: Netflix (100K+ containers), Intuit (8K+ Applications), Spotify (1.5K+ engineers supported)
  </text>
</svg>
