apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: argocd-alerts
  namespace: argocd
spec:
  groups:
  - name: argocd
    interval: 30s
    rules:
    - alert: ArgoCDAppOutOfSync
      expr: argocd_app_out_of_sync == 1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "ArgoCD application out of sync"
        description: "Application {{ $labels.app_name }} is out of sync for more than 5 minutes"
    
    - alert: ArgoCDAppSyncFailure
      expr: rate(argocd_app_sync_total{status="Failed"}[5m]) > 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "ArgoCD application sync failed"
        description: "Application {{ $labels.app_name }} sync has failed"
    
    - alert: ArgoCDAppUnhealthy
      expr: argocd_app_health_status != 1
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "ArgoCD application unhealthy"
        description: "Application {{ $labels.app_name }} is not healthy"
