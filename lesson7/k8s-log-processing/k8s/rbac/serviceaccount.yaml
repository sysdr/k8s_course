apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-processing-sa
  namespace: log-processing
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: log-processing-role
  namespace: log-processing
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: log-processing-rolebinding
  namespace: log-processing
subjects:
- kind: ServiceAccount
  name: log-processing-sa
  namespace: log-processing
roleRef:
  kind: Role
  name: log-processing-role
  apiGroup: rbac.authorization.k8s.io
