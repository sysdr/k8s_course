apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-engine
  namespace: log-processing
  labels:
    app: analytics-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: analytics-engine
  template:
    metadata:
      labels:
        app: analytics-engine
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      # Init container for database migrations
      initContainers:
      - name: db-migration
        image: analytics-engine-init:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: POSTGRES_HOST
          value: postgres-service
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: logs
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: password
        volumeMounts:
        - name: init-scripts
          mountPath: /tmp/init
      containers:
      - name: analytics-engine
        image: analytics-engine:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8001
          name: metrics
        env:
        - name: REDIS_URL
          value: "redis://redis-service:6379"
        - name: POSTGRES_DSN
          value: "postgresql://postgres:postgres@postgres-service:5432/logs"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        volumeMounts:
        - name: data
          mountPath: /data
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: init-scripts
        emptyDir: {}
      - name: data
        persistentVolumeClaim:
          claimName: analytics-data-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: analytics-data-pvc
  namespace: log-processing
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
