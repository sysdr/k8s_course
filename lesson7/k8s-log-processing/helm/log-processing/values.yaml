# Default values for log-processing

global:
  namespace: log-processing

ingestionApi:
  name: ingestion-api
  replicaCount: 3
  image:
    repository: ingestion-api
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPU: 70
    targetMemory: 80
  pdb:
    enabled: true
    minAvailable: 2

analyticsEngine:
  name: analytics-engine
  replicaCount: 2
  image:
    repository: analytics-engine
    tag: latest
    pullPolicy: IfNotPresent
  initImage:
    repository: analytics-engine-init
    tag: latest
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""

dashboard:
  name: dashboard
  replicaCount: 2
  image:
    repository: dashboard
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    port: 80
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "400m"

redis:
  enabled: true
  image:
    repository: redis
    tag: 7-alpine
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: 15-alpine
  persistence:
    enabled: true
    size: 20Gi
  auth:
    database: logs
    username: postgres
    password: postgres

monitoring:
  prometheus:
    enabled: true
    image:
      repository: prom/prometheus
      tag: v2.47.0
  grafana:
    enabled: true
    image:
      repository: grafana/grafana
      tag: 10.1.0
    adminPassword: admin

networkPolicy:
  enabled: true

rbac:
  create: true
  serviceAccount:
    name: log-processing-sa
