# Default values for log-platform

# Global settings
global:
  imageRegistry: docker.io
  imagePullSecrets: []

# Pod Security Standards configuration
podSecurity:
  publicNamespace:
    enforce: baseline
    audit: restricted
    warn: restricted
  paymentNamespace:
    enforce: restricted
    audit: restricted
    warn: restricted
  systemNamespace:
    enforce: privileged
    audit: privileged
    warn: privileged

# Log Ingestion Service
logIngestion:
  enabled: true
  replicaCount: 3
  image:
    repository: log-ingestion
    tag: latest
    pullPolicy: IfNotPresent
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilization: 70

# Log Processor Service
logProcessor:
  enabled: true
  replicaCount: 2
  image:
    repository: log-processor
    tag: latest
    pullPolicy: IfNotPresent
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "400m"

# Log Query Service
logQuery:
  enabled: true
  replicaCount: 2
  image:
    repository: log-query
    tag: latest
    pullPolicy: IfNotPresent
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    fsGroup: 10001
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# Security Dashboard
securityDashboard:
  enabled: true
  replicaCount: 2
  image:
    repository: security-dashboard
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    port: 80

# Redis
redis:
  enabled: true
  image:
    repository: redis
    tag: 7-alpine
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# Network Policies
networkPolicies:
  enabled: true

# Monitoring
monitoring:
  enabled: true
  prometheus:
    enabled: true
  grafana:
    enabled: true
