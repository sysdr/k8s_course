apiVersion: v1
kind: Namespace
metadata:
  name: logs-payment
  labels:
    name: logs-payment
    tier: critical
    compliance: pci-dss
    # Pod Security Standards for payment logs (restricted policy)
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.28
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    description: "PCI-compliant payment logs with restricted security policy"
    compliance-requirements: "PCI-DSS Level 1"
