apiVersion: v1
kind: Namespace
metadata:
  name: logs-public
  labels:
    name: logs-public
    tier: application
    # Pod Security Standards for public logs (baseline policy)
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.28
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    description: "Public application logs with baseline security policy"
