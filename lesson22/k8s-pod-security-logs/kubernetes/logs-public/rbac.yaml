apiVersion: v1
kind: ServiceAccount
metadata:
  name: security-dashboard-sa
  namespace: logs-public
  labels:
    app: security-dashboard

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-security-viewer
rules:
- apiGroups: [""]
  resources: ["namespaces", "pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["events.k8s.io"]
  resources: ["events"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: security-dashboard-binding
subjects:
- kind: ServiceAccount
  name: security-dashboard-sa
  namespace: logs-public
roleRef:
  kind: ClusterRole
  name: pod-security-viewer
  apiGroup: rbac.authorization.k8s.io
