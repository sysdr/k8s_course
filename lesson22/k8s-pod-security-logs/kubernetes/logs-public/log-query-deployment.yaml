apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-query
  namespace: logs-public
  labels:
    app: log-query
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: log-query
  template:
    metadata:
      labels:
        app: log-query
        tier: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      
      containers:
      - name: log-query
        image: log-query:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8002
          name: http
        
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: false
        
        livenessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 20
          periodSeconds: 10
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 5
          periodSeconds: 5
        
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"

---
apiVersion: v1
kind: Service
metadata:
  name: log-query-service
  namespace: logs-public
  labels:
    app: log-query
spec:
  type: ClusterIP
  ports:
  - port: 8002
    targetPort: 8002
    protocol: TCP
    name: http
  selector:
    app: log-query
