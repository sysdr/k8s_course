apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-processor
  namespace: logs-payment
  labels:
    app: log-processor
    tier: backend
    security-policy: restricted
    compliance: pci-dss
spec:
  replicas: 2
  selector:
    matchLabels:
      app: log-processor
  template:
    metadata:
      labels:
        app: log-processor
        tier: backend
        security-policy: restricted
        compliance: pci-dss
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
    spec:
      # Security Context for Restricted Pod Security Standard
      securityContext:
        # REQUIRED: Run as non-root user
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        # REQUIRED: Enable seccomp filtering
        seccompProfile:
          type: RuntimeDefault
        # RECOMMENDED: Set fsGroupChangePolicy for better performance
        fsGroupChangePolicy: "OnRootMismatch"
      
      containers:
      - name: log-processor
        image: log-processor:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8001
          name: http
          protocol: TCP
        
        # Container Security Context - Restricted Requirements
        securityContext:
          # REQUIRED: Disable privilege escalation
          allowPrivilegeEscalation: false
          # REQUIRED: Drop all capabilities
          capabilities:
            drop:
              - ALL
          # REQUIRED for restricted: Read-only root filesystem
          readOnlyRootFilesystem: true
          # REQUIRED: Run as non-root
          runAsNonRoot: true
          runAsUser: 10001
        
        # Health checks
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 5
        
        # Startup probe for slow-starting containers
        startupProbe:
          httpGet:
            path: /health
            port: 8001
          failureThreshold: 30
          periodSeconds: 10
        
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "400m"
        
        # Required volume mounts for read-only root filesystem
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: app-data
          mountPath: /tmp/app-data
        - name: home
          mountPath: /home/processor
      
      volumes:
      # Writable directories (required with read-only root filesystem)
      - name: tmp
        emptyDir: {}
      - name: app-data
        emptyDir: {}
      - name: home
        emptyDir: {}
      
      # High availability
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - log-processor
            topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: log-processor-service
  namespace: logs-payment
  labels:
    app: log-processor
spec:
  type: ClusterIP
  ports:
  - port: 8001
    targetPort: 8001
    protocol: TCP
    name: http
  selector:
    app: log-processor

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: log-processor-hpa
  namespace: logs-payment
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: log-processor
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: log-processor-pdb
  namespace: logs-payment
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: log-processor
