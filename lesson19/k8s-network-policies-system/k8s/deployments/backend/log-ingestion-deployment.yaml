apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-ingestion
  namespace: backend
  labels:
    app: log-ingestion
spec:
  replicas: 3
  selector:
    matchLabels:
      app: log-ingestion
  template:
    metadata:
      labels:
        app: log-ingestion
        version: v1
    spec:
      containers:
      - name: log-ingestion
        image: log-ingestion:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8001
          name: http
        - containerPort: 9090
          name: metrics
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka.data-layer.svc.cluster.local:9092"
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: log-ingestion
  namespace: backend
  labels:
    app: log-ingestion
spec:
  type: ClusterIP
  ports:
  - port: 8001
    targetPort: 8001
    name: http
  - port: 9090
    targetPort: 9090
    name: metrics
  selector:
    app: log-ingestion
