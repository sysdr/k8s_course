apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-processor
  namespace: backend
  labels:
    app: log-processor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: log-processor
  template:
    metadata:
      labels:
        app: log-processor
        version: v1
    spec:
      containers:
      - name: log-processor
        image: log-processor:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8002
          name: metrics
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka.data-layer.svc.cluster.local:9092"
        - name: DB_HOST
          value: "timescaledb.data-layer.svc.cluster.local"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "logs"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: timescaledb-secret
              key: password
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: log-processor
  namespace: backend
  labels:
    app: log-processor
spec:
  type: ClusterIP
  ports:
  - port: 8002
    targetPort: 8002
    name: metrics
  selector:
    app: log-processor
