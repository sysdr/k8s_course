apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: backend
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: api-gateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: log-ingestion-pdb
  namespace: backend
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: log-ingestion
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: analytics-pdb
  namespace: backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: analytics-service
