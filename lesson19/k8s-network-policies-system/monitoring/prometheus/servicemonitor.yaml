apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api-gateway-monitor
  namespace: backend
  labels:
    app: api-gateway
spec:
  selector:
    matchLabels:
      app: api-gateway
  endpoints:
  - port: metrics
    interval: 15s
    path: /metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: log-ingestion-monitor
  namespace: backend
  labels:
    app: log-ingestion
spec:
  selector:
    matchLabels:
      app: log-ingestion
  endpoints:
  - port: metrics
    interval: 15s
    path: /metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: analytics-monitor
  namespace: backend
  labels:
    app: analytics-service
spec:
  selector:
    matchLabels:
      app: analytics-service
  endpoints:
  - port: metrics
    interval: 15s
    path: /metrics
