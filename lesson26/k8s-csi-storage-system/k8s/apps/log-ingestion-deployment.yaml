apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-ingestion
  labels:
    app: log-ingestion
spec:
  replicas: 2
  selector:
    matchLabels:
      app: log-ingestion
  template:
    metadata:
      labels:
        app: log-ingestion
    spec:
      containers:
      - name: log-ingestion
        image: log-ingestion:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: LOG_FILE
          value: "/data/logs/app.log"
        volumeMounts:
        - name: log-storage
          mountPath: /data
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: log-storage
        persistentVolumeClaim:
          claimName: log-ingestion-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: log-ingestion
spec:
  selector:
    app: log-ingestion
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: log-ingestion-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 10Gi
