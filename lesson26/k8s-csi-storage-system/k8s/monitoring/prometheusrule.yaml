apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: log-analytics-alerts
spec:
  groups:
  - name: log-analytics
    rules:
    - alert: HighLogVolume
      expr: log_total_logs > 10000
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High log volume detected"
