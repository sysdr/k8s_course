---
# Job that runs the deployer - will fail with broken RBAC
apiVersion: batch/v1
kind: Job
metadata:
  name: deployment-job
  namespace: ci-cd
  labels:
    app: ci-cd-deployer
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: ci-cd-deployer
    spec:
      serviceAccountName: deployer  # Uses the deployer ServiceAccount
      restartPolicy: Never
      containers:
      - name: deployer
        image: deployer:latest
        imagePullPolicy: Never  # Use local image
        env:
        - name: TARGET_NAMESPACE
          value: "production"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
      securityContext:
        fsGroup: 1000
