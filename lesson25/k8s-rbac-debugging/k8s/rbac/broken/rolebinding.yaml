---
# BROKEN: This RoleBinding references a Role in the ci-cd namespace
# but doesn't grant permissions in the production namespace where deployments happen
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer-binding
  namespace: ci-cd  # WRONG: Should be in production namespace
  labels:
    app: ci-cd-deployer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployer-role  # References role in ci-cd namespace
subjects:
- kind: ServiceAccount
  name: deployer
  namespace: ci-cd
