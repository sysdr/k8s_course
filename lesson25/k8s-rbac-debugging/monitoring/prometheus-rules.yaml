apiVersion: v1
kind: ConfigMap
metadata:
  name: rbac-alerts
  namespace: monitoring
data:
  rbac-alerts.yaml: |
    groups:
    - name: rbac-security
      interval: 30s
      rules:
      - alert: RBACPermissionDenied
        expr: |
          rate(apiserver_request_total{verb="create",code="403"}[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
          component: rbac
        annotations:
          summary: "RBAC permission denied for {{ $labels.resource }}"
          description: "ServiceAccount {{ $labels.user }} denied {{ $labels.verb }} on {{ $labels.resource }}"
      
      - alert: ExcessiveRBACPermissions
        expr: |
          sum(rbac_authorization_decisions_total{decision="allow"}) by (user) > 1000
        for: 5m
        labels:
          severity: info
          component: rbac
        annotations:
          summary: "ServiceAccount {{ $labels.user }} has excessive permissions"
          description: "Consider reviewing RBAC configuration for least privilege"

