apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-api
  namespace: log-analytics
  labels:
    app: query-api
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: query-api
  template:
    metadata:
      labels:
        app: query-api
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
    spec:
      containers:
      - name: query-api
        image: query-api:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8001
          name: http
        env:
        - name: DB_HOST
          value: "timescaledb-lb.log-analytics.svc.cluster.local"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: timescaledb-secret
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: timescaledb-secret
              key: password
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: timescaledb-secret
              key: database
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8001
          initialDelaySeconds: 20
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: query-api
  namespace: log-analytics
  labels:
    app: query-api
spec:
  type: ClusterIP
  ports:
  - port: 8001
    targetPort: 8001
    name: http
  selector:
    app: query-api
