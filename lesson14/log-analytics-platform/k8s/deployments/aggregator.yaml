apiVersion: apps/v1
kind: Deployment
metadata:
  name: aggregator
  namespace: log-analytics
  labels:
    app: aggregator
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aggregator
  template:
    metadata:
      labels:
        app: aggregator
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8002"
    spec:
      containers:
      - name: aggregator
        image: aggregator:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8002
          name: metrics
        env:
        - name: DB_HOST
          value: "timescaledb-lb.log-analytics.svc.cluster.local"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: timescaledb-secret
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: timescaledb-secret
              key: password
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: timescaledb-secret
              key: database
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            secretKeyRef:
              name: kafka-secret
              key: bootstrap-servers
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: aggregator
  namespace: log-analytics
  labels:
    app: aggregator
spec:
  type: ClusterIP
  ports:
  - port: 8002
    targetPort: 8002
    name: metrics
  selector:
    app: aggregator
