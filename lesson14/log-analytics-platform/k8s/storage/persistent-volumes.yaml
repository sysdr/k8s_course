# Manual PV for local development with hostPath
apiVersion: v1
kind: PersistentVolume
metadata:
  name: timescaledb-pv-0
  labels:
    type: local
    app: timescaledb
spec:
  storageClassName: local-storage
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: "/mnt/data/timescaledb-0"
    type: DirectoryOrCreate
---
