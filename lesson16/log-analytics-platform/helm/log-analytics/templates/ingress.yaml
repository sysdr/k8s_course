{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "log-analytics.fullname" . }}
  labels:
    {{- include "log-analytics.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
  - hosts:
    - {{ .Values.global.domain }}
    secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
  - host: {{ .Values.global.domain }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "log-analytics.fullname" . }}-frontend
            port:
              number: 80
      - path: /api/ingest
        pathType: Prefix
        backend:
          service:
            name: {{ include "log-analytics.fullname" . }}-log-ingestion
            port:
              number: 8000
      - path: /api/query
        pathType: Prefix
        backend:
          service:
            name: {{ include "log-analytics.fullname" . }}-query
            port:
              number: 8001
      - path: /api/analytics
        pathType: Prefix
        backend:
          service:
            name: {{ include "log-analytics.fullname" . }}-analytics
            port:
              number: 8002
{{- end }}
