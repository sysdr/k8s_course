# Separate Ingress for heavily rate-limited endpoints
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: log-analytics-ingress-limited
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: "10"  # Strict limit for write operations
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    nginx.ingress.kubernetes.io/limit-whitelist: ""  # Add trusted IPs here
spec:
  ingressClassName: nginx
  rules:
  - host: localhost
    http:
      paths:
      - path: /api/ingest/batch
        pathType: Exact
        backend:
          service:
            name: log-ingestion-service
            port:
              number: 8000
