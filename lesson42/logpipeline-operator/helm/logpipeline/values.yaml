# Default values for logpipeline-operator

operator:
  image:
    repository: logpipeline/operator
    tag: latest
    pullPolicy: IfNotPresent
  
  replicas: 2
  
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

collector:
  image:
    repository: logpipeline/collector
    tag: latest
  
  defaultReplicas: 2

processor:
  image:
    repository: logpipeline/processor
    tag: latest
  
  defaultReplicas: 3

sink:
  image:
    repository: logpipeline/sink
    tag: latest
  
  defaultReplicas: 2

infrastructure:
  kafka:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
  
  redis:
    enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  
  elasticsearch:
    enabled: true
    storage: 10Gi
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 2Gi

monitoring:
  prometheus:
    enabled: true
    scrapeInterval: 15s
  
  grafana:
    enabled: true
    adminPassword: admin

frontend:
  enabled: true
  image:
    repository: logpipeline/dashboard
    tag: latest
  service:
    type: LoadBalancer
    port: 80
