apiVersion: v1
kind: ServiceAccount
metadata:
  name: logpipeline-operator
  namespace: logging-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: logpipeline-operator
rules:
  - apiGroups: ["logpipeline.k8s.io"]
    resources: ["logpipelines"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["logpipeline.k8s.io"]
    resources: ["logpipelines/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets", "pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: logpipeline-operator
subjects:
  - kind: ServiceAccount
    name: logpipeline-operator
    namespace: logging-system
roleRef:
  kind: ClusterRole
  name: logpipeline-operator
  apiGroup: rbac.authorization.k8s.io
