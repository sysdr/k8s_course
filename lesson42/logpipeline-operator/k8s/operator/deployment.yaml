apiVersion: apps/v1
kind: Deployment
metadata:
  name: logpipeline-operator
  namespace: logging-system
  labels:
    app: logpipeline-operator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: logpipeline-operator
  template:
    metadata:
      labels:
        app: logpipeline-operator
    spec:
      serviceAccountName: logpipeline-operator
      containers:
        - name: operator
          image: logpipeline/operator:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
