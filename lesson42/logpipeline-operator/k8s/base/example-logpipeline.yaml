apiVersion: logpipeline.k8s.io/v1
kind: LogPipeline
metadata:
  name: production-logs
  namespace: logging
spec:
  source:
    type: kubernetes
    namespaces:
      - production
      - staging
    labelSelector:
      app: backend
  collector:
    replicas: 3
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
  processors:
    - type: filter
      config:
        excludeDebug: true
    - type: parse
      config:
        format: json
    - type: enrich
      config:
        addNodeInfo: true
  processor:
    replicas: 5
  sink:
    type: elasticsearch
    replicas: 2
    config:
      endpoint: "http://elasticsearch:9200"
      index: "logs-production"
