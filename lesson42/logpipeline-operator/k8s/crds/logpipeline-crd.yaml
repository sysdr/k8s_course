apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: logpipelines.logpipeline.k8s.io
  annotations:
    api-approved.kubernetes.io: "unapproved"
spec:
  group: logpipeline.k8s.io
  names:
    kind: LogPipeline
    listKind: LogPipelineList
    plural: logpipelines
    singular: logpipeline
    shortNames:
      - lp
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - source
                - processors
                - sink
              properties:
                source:
                  type: object
                  required:
                    - type
                  properties:
                    type:
                      type: string
                      enum:
                        - kubernetes
                        - syslog
                        - http
                    namespaces:
                      type: array
                      items:
                        type: string
                    labelSelector:
                      type: object
                      additionalProperties:
                        type: string
                collector:
                  type: object
                  properties:
                    replicas:
                      type: integer
                      minimum: 1
                      maximum: 10
                      default: 2
                    resources:
                      type: object
                      properties:
                        requests:
                          type: object
                          properties:
                            cpu:
                              type: string
                            memory:
                              type: string
                        limits:
                          type: object
                          properties:
                            cpu:
                              type: string
                            memory:
                              type: string
                processors:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - type
                    properties:
                      type:
                        type: string
                        enum:
                          - filter
                          - parse
                          - enrich
                          - transform
                      config:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                processor:
                  type: object
                  properties:
                    replicas:
                      type: integer
                      minimum: 1
                      maximum: 20
                      default: 3
                sink:
                  type: object
                  required:
                    - type
                  properties:
                    type:
                      type: string
                      enum:
                        - elasticsearch
                        - s3
                        - kafka
                        - http
                    config:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    replicas:
                      type: integer
                      minimum: 1
                      maximum: 10
                      default: 2
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Running
                    - Failed
                    - Terminating
                message:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                observedGeneration:
                  type: integer
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
