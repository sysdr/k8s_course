apiVersion: v1
kind: ServiceAccount
metadata:
  name: falco
  namespace: runtime-security
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: falco
rules:
- apiGroups: [""]
  resources: ["nodes", "namespaces", "pods", "replicationcontrollers", "services"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: falco
subjects:
- kind: ServiceAccount
  name: falco
  namespace: runtime-security
roleRef:
  kind: ClusterRole
  name: falco
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: falco-config
  namespace: runtime-security
data:
  falco.yaml: |
    rules_file:
      - /etc/falco/falco_rules.yaml
    json_output: true
    json_include_output_property: true
    http_output:
      enabled: true
      url: "http://security-event-processor-service:8000/api/v1/events/ingest"
    driver:
      enabled: true
      modern_ebpf:
        enabled: true
  falco_rules.yaml: |
    - rule: Shell Spawned in Container
      desc: Detect shell being spawned in container
      condition: >
        evt.type = execve and
        (proc.name in (bash, sh, zsh, csh, ksh))
      output: Shell spawned in container (user=%user.name shell=%proc.name)
      priority: WARNING
    - rule: Write to Sensitive File
      desc: Detect writes to sensitive system files
      condition: >
        evt.type = open and
        (fd.name startswith /etc or fd.name startswith /root)
      output: Sensitive file write (user=%user.name file=%fd.name)
      priority: ERROR
    - rule: Unexpected Network Connection
      desc: Detect unexpected outbound connections
      condition: >
        evt.type = connect and fd.sport > 1024
      output: Unexpected connection (user=%user.name destination=%fd.rip:%fd.rport)
      priority: WARNING
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: falco
  namespace: runtime-security
spec:
  selector:
    matchLabels:
      app: falco
  template:
    metadata:
      labels:
        app: falco
      annotations:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/warn: privileged
    spec:
      serviceAccountName: falco
      hostNetwork: true
      hostPID: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/master
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
      containers:
      - name: falco
        image: docker.io/falcosecurity/falco:latest
        securityContext:
          privileged: true
        env:
        - name: FALCO_BPF_PROBE
          value: ""
        args: ["/usr/bin/falco", "-c", "/etc/falco/falco.yaml"]
        volumeMounts:
        - name: config
          mountPath: /etc/falco
        - name: docker-socket
          mountPath: /var/run/docker.sock
        - name: proc
          mountPath: /host/proc
          readOnly: true
        - name: sys
          mountPath: /host/sys
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
      volumes:
      - name: config
        configMap:
          name: falco-config
      - name: docker-socket
        hostPath:
          path: /var/run/docker.sock
      - name: proc
        hostPath:
          path: /proc
      - name: sys
        hostPath:
          path: /sys
