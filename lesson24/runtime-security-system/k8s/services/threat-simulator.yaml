apiVersion: v1
kind: Service
metadata:
  name: threat-simulator-service
  namespace: runtime-security
spec:
  selector:
    app: threat-simulator
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: threat-simulator
  namespace: runtime-security
spec:
  replicas: 1
  selector:
    matchLabels:
      app: threat-simulator
  template:
    metadata:
      labels:
        app: threat-simulator
    spec:
      containers:
      - name: simulator
        image: threat-simulator:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
