apiVersion: v1
kind: ServiceAccount
metadata:
  name: incident-response-sa
  namespace: runtime-security
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: incident-response-role
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch", "delete"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "patch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: incident-response-binding
subjects:
- kind: ServiceAccount
  name: incident-response-sa
  namespace: runtime-security
roleRef:
  kind: ClusterRole
  name: incident-response-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Service
metadata:
  name: incident-response-service
  namespace: runtime-security
spec:
  selector:
    app: incident-response-controller
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-response-controller
  namespace: runtime-security
spec:
  replicas: 1
  selector:
    matchLabels:
      app: incident-response-controller
  template:
    metadata:
      labels:
        app: incident-response-controller
    spec:
      serviceAccountName: incident-response-sa
      containers:
      - name: controller
        image: incident-response-controller:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
