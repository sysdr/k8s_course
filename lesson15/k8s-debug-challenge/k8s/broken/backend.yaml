apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: debug-challenge
  labels:
    app: backend
    tier: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        tier: api
    spec:
      containers:
      - name: backend
        image: python:3.11-slim
        command: ["/bin/bash"]
        args:
          - -c
          - |
            pip install --no-cache-dir fastapi uvicorn sqlalchemy psycopg2-binary pydantic redis prometheus-client python-json-logger pydantic-settings
            mkdir -p /app
            cat > /app/main.py << 'PYEOF'
            from fastapi import FastAPI, HTTPException, Depends
            from fastapi.middleware.cors import CORSMiddleware
            from sqlalchemy import create_engine, Column, Integer, String, Float, DateTime
            from sqlalchemy.ext.declarative import declarative_base
            from sqlalchemy.orm import sessionmaker, Session
            from pydantic import BaseModel
            from datetime import datetime
            from typing import List, Optional
            import os
            import logging

            logging.basicConfig(level=logging.INFO, format='{"timestamp": "%(asctime)s", "level": "%(levelname)s", "message": "%(message)s"}')
            logger = logging.getLogger(__name__)

            DATABASE_URL = os.getenv("DATABASE_URL", "postgresql://ecommerce:password@postgres-svc:5432/ecommerce")

            engine = create_engine(DATABASE_URL)
            SessionLocal = sessionmaker(autocommit=False, autoflush=False, bind=engine)
            Base = declarative_base()

            class Product(Base):
                __tablename__ = "products"
                id = Column(Integer, primary_key=True, index=True)
                name = Column(String, index=True)
                description = Column(String)
                price = Column(Float)
                stock = Column(Integer)
                category = Column(String, index=True)
                created_at = Column(DateTime, default=datetime.utcnow)

            class ProductResponse(BaseModel):
                id: int
                name: str
                description: str
                price: float
                stock: int
                category: str
                created_at: datetime
                class Config:
                    from_attributes = True

            app = FastAPI(title="E-Commerce Backend API", version="1.0.0")

            app.add_middleware(
                CORSMiddleware,
                allow_origins=["*"],
                allow_credentials=True,
                allow_methods=["*"],
                allow_headers=["*"],
            )

            def get_db():
                db = SessionLocal()
                try:
                    yield db
                finally:
                    db.close()

            @app.get("/health")
            async def health_check():
                health_status = {
                    "status": "healthy",
                    "timestamp": datetime.utcnow().isoformat(),
                    "service": "backend-api",
                    "version": "1.0.0"
                }
                try:
                    db = SessionLocal()
                    db.execute("SELECT 1")
                    db.close()
                    health_status["database"] = "connected"
                except Exception as e:
                    health_status["database"] = f"error: {str(e)}"
                    health_status["status"] = "degraded"
                logger.info(f"Health check: {health_status['status']}")
                return health_status

            @app.get("/api/products", response_model=List[ProductResponse])
            async def get_products(skip: int = 0, limit: int = 100, category: Optional[str] = None, db: Session = Depends(get_db)):
                logger.info(f"Fetching products: skip={skip}, limit={limit}, category={category}")
                query = db.query(Product)
                if category:
                    query = query.filter(Product.category == category)
                products = query.offset(skip).limit(limit).all()
                logger.info(f"Returning {len(products)} products")
                return products

            @app.get("/api/stats")
            async def get_stats(db: Session = Depends(get_db)):
                total_products = db.query(Product).count()
                total_value = db.query(Product).with_entities(db.func.sum(Product.price * Product.stock)).scalar() or 0
                categories = db.query(Product.category, db.func.count(Product.id)).group_by(Product.category).all()
                return {
                    "total_products": total_products,
                    "total_inventory_value": float(total_value),
                    "categories": [{"name": cat, "count": count} for cat, count in categories],
                    "timestamp": datetime.utcnow().isoformat()
                }

            @app.get("/")
            async def root():
                return {"service": "E-Commerce Backend API", "version": "1.0.0", "status": "running"}

            if __name__ == "__main__":
                import uvicorn
                uvicorn.run(app, host="0.0.0.0", port=8000)
            PYEOF
            python /app/main.py
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: DATABASE_URL
          value: "postgresql://ecommerce:password@postgres-svc:5432/ecommerce"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
---
# BUG 1: Service name is "backend-api" but frontend will try to connect to "api-backend"
apiVersion: v1
kind: Service
metadata:
  name: backend-api
  namespace: debug-challenge
  labels:
    app: backend
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: backend
