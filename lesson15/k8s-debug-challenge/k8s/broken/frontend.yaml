apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: debug-challenge
  labels:
    app: frontend
    tier: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        tier: web
    spec:
      containers:
      - name: frontend
        image: node:18-alpine
        command: ["/bin/sh"]
        args:
          - -c
          - |
            apk add --no-cache curl
            mkdir -p /app
            cd /app
            cat > package.json << 'PKGEOF'
            {
              "name": "frontend",
              "version": "1.0.0",
              "dependencies": {
                "express": "^4.18.2",
                "axios": "^1.6.2"
              }
            }
            PKGEOF
            npm install
            cat > server.js << 'SRVEOF'
            const express = require('express');
            const axios = require('axios');
            const app = express();

            const API_URL = process.env.API_URL || 'http://api-backend:8000';
            console.log(`Frontend starting... API_URL: ${API_URL}`);

            app.get('/health', (req, res) => {
              res.json({ status: 'healthy', service: 'frontend', api_url: API_URL });
            });

            app.get('/', async (req, res) => {
              try {
                console.log(`Attempting to fetch from: ${API_URL}/api/products`);
                const response = await axios.get(`${API_URL}/api/products`, { timeout: 5000 });
                res.json({
                  status: 'success',
                  data: response.data,
                  api_url: API_URL
                });
              } catch (error) {
                console.error(`Failed to fetch products: ${error.message}`);
                res.status(500).json({
                  status: 'error',
                  message: `Failed to connect to backend: ${error.message}`,
                  api_url: API_URL,
                  error_code: error.code
                });
              }
            });

            const PORT = 3000;
            app.listen(PORT, '0.0.0.0', () => {
              console.log(`Frontend server running on port ${PORT}`);
              console.log(`Configured to connect to backend at: ${API_URL}`);
            });
            SRVEOF
            node server.js
        ports:
        - containerPort: 3000
          name: http
        env:
        # BUG 2: Wrong service name - should be "backend-api" not "api-backend"
        - name: API_URL
          value: "http://api-backend:8000"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: debug-challenge
  labels:
    app: frontend
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: frontend
