# Scenario 1: IAM Permission Failure
# This simulates a cluster autoscaler with insufficient IAM permissions

apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-autoscaler-broken
  namespace: kube-system
  annotations:
    # Intentionally missing or incorrect IAM role
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/nonexistent-role
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-autoscaler-broken-iam
  namespace: kube-system
  labels:
    app: cluster-autoscaler-debug
    scenario: iam-failure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cluster-autoscaler-debug
      scenario: iam-failure
  template:
    metadata:
      labels:
        app: cluster-autoscaler-debug
        scenario: iam-failure
    spec:
      serviceAccountName: cluster-autoscaler-broken
      containers:
        - image: registry.k8s.io/autoscaling/cluster-autoscaler:v1.28.2
          name: cluster-autoscaler
          command:
            - ./cluster-autoscaler
            - --v=4
            - --cloud-provider=aws
            - --node-group-auto-discovery=asg:tag=k8s.io/cluster-autoscaler/enabled
          resources:
            limits:
              cpu: 100m
              memory: 300Mi
            requests:
              cpu: 100m
              memory: 300Mi
---
# Deploy workload that requires scaling
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resource-hungry-app
  namespace: default
spec:
  replicas: 20
  selector:
    matchLabels:
      app: resource-hungry
  template:
    metadata:
      labels:
        app: resource-hungry
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            cpu: 1000m
            memory: 2Gi
