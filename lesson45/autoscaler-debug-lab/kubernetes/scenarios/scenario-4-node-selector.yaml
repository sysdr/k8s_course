# Scenario 4: Pod Node Selector Doesn't Match Any Node Group
# Autoscaler skips because no node group can satisfy requirements

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-workload
  namespace: default
  labels:
    scenario: node-selector-mismatch
spec:
  replicas: 10
  selector:
    matchLabels:
      app: gpu-job
  template:
    metadata:
      labels:
        app: gpu-job
    spec:
      nodeSelector:
        node-type: gpu-a100  # No node group has this label
        gpu-memory: high
      containers:
      - name: ml-training
        image: tensorflow/tensorflow:latest-gpu
        resources:
          requests:
            cpu: 4000m
            memory: 16Gi
            nvidia.com/gpu: 1
          limits:
            cpu: 8000m
            memory: 32Gi
            nvidia.com/gpu: 1
---
# Pod with impossible affinity rules
apiVersion: apps/v1
kind: Deployment
metadata:
  name: affinity-impossible
  namespace: default
spec:
  replicas: 5
  selector:
    matchLabels:
      app: affinity-test
  template:
    metadata:
      labels:
        app: affinity-test
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: zone
                operator: In
                values:
                - us-west-99  # Non-existent zone
              - key: instance-type
                operator: In
                values:
                - super-ultra-mega-instance  # Non-existent type
      containers:
      - name: app
        image: nginx:alpine
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
