# Scenario 5: Pods Don't Tolerate Node Taints
# New nodes have taints but pods lack matching tolerations

apiVersion: v1
kind: ConfigMap
metadata:
  name: taint-config
  namespace: kube-system
data:
  node-taints.yaml: |
    # Simulated node group with taints
    taints:
      - key: workload-type
        value: batch
        effect: NoSchedule
      - key: dedicated
        value: processing
        effect: NoSchedule
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: untolerated-workload
  namespace: default
spec:
  replicas: 15
  selector:
    matchLabels:
      app: no-toleration
  template:
    metadata:
      labels:
        app: no-toleration
    spec:
      # Missing tolerations for node taints
      containers:
      - name: processor
        image: nginx:alpine
        resources:
          requests:
            cpu: 2000m
            memory: 4Gi
---
# Correct example with tolerations
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tolerated-workload
  namespace: default
spec:
  replicas: 5
  selector:
    matchLabels:
      app: with-toleration
  template:
    metadata:
      labels:
        app: with-toleration
    spec:
      tolerations:
      - key: "workload-type"
        operator: "Equal"
        value: "batch"
        effect: "NoSchedule"
      - key: "dedicated"
        operator: "Equal"
        value: "processing"
        effect: "NoSchedule"
      containers:
      - name: processor
        image: nginx:alpine
        resources:
          requests:
            cpu: 2000m
            memory: 4Gi
