# Scenario 3: Resource Quota Preventing Pod Scheduling
# Autoscaler won't add nodes because namespace quota is exhausted

apiVersion: v1
kind: Namespace
metadata:
  name: quota-limited
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-quota
  namespace: quota-limited
spec:
  hard:
    requests.cpu: "10"      # Very restrictive quota
    requests.memory: "20Gi"
    limits.cpu: "20"
    limits.memory: "40Gi"
    pods: "20"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quota-blocked-app
  namespace: quota-limited
spec:
  replicas: 30  # Exceeds quota
  selector:
    matchLabels:
      app: quota-test
  template:
    metadata:
      labels:
        app: quota-test
    spec:
      containers:
      - name: app
        image: nginx:alpine
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 1000m
            memory: 2Gi
