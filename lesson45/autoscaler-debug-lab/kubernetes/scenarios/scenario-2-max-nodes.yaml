# Scenario 2: Node Group Maximum Size Reached
# Simulates autoscaler hitting node group limits

apiVersion: v1
kind: ConfigMap
metadata:
  name: autoscaler-config-max-nodes
  namespace: kube-system
data:
  cluster-config.yaml: |
    # Simulated ASG configuration with max nodes reached
    nodeGroups:
      - name: general-purpose-nodes
        minSize: 3
        maxSize: 5  # Already at 5 nodes
        currentSize: 5
        instanceType: t3.xlarge
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scale-test-deployment
  namespace: default
  labels:
    scenario: max-nodes-reached
spec:
  replicas: 50  # Requires more than 5 nodes
  selector:
    matchLabels:
      app: scale-test
  template:
    metadata:
      labels:
        app: scale-test
    spec:
      containers:
      - name: cpu-intensive
        image: nginx:alpine
        resources:
          requests:
            cpu: 2000m  # Each replica needs 2 cores
            memory: 4Gi
          limits:
            cpu: 2000m
            memory: 4Gi
