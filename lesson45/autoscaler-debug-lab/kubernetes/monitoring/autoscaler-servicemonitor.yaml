apiVersion: v1
kind: Service
metadata:
  name: cluster-autoscaler-metrics
  namespace: kube-system
  labels:
    app: cluster-autoscaler
spec:
  selector:
    app: cluster-autoscaler
  ports:
  - name: metrics
    port: 8085
    targetPort: 8085
    protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cluster-autoscaler
  namespace: kube-system
  labels:
    app: cluster-autoscaler
spec:
  selector:
    matchLabels:
      app: cluster-autoscaler
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cluster-autoscaler-alerts
  namespace: kube-system
spec:
  groups:
  - name: autoscaler
    interval: 30s
    rules:
    - alert: ClusterAutoscalerScaleUpFailed
      expr: increase(cluster_autoscaler_failed_scale_ups_total[15m]) > 3
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Cluster Autoscaler failing to scale up"
        description: "Cluster autoscaler has failed {{ $value }} scale-up attempts in the last 15 minutes"
    
    - alert: ClusterAutoscalerUnschedulablePods
      expr: cluster_autoscaler_unschedulable_pods_count > 5
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "High number of unschedulable pods"
        description: "{{ $value }} pods are unschedulable for more than 10 minutes"
    
    - alert: ClusterAutoscalerErrorsHigh
      expr: rate(cluster_autoscaler_errors_total[5m]) > 0.1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Cluster Autoscaler error rate is high"
        description: "Error rate: {{ $value }} errors/second"
    
    - alert: ClusterAutoscalerMaxNodeReached
      expr: cluster_autoscaler_max_nodes_count - cluster_autoscaler_nodes_count < 2
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Approaching maximum node count"
        description: "Only {{ $value }} nodes away from maximum"
