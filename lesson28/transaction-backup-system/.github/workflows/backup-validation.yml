name: Backup Validation

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM
  workflow_dispatch:

jobs:
  backup-restore-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install tools
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          
          wget https://github.com/vmware-tanzu/velero/releases/download/v1.12.0/velero-v1.12.0-linux-amd64.tar.gz
          tar -xvf velero-v1.12.0-linux-amd64.tar.gz
          sudo mv velero-v1.12.0-linux-amd64/velero /usr/local/bin/
      
      - name: Setup cluster
        run: ./scripts/setup-cluster.sh
      
      - name: Build images
        run: ./scripts/build.sh
      
      - name: Deploy system
        run: ./scripts/deploy.sh
      
      - name: Run disaster recovery test
        run: ./scripts/disaster-test.sh
      
      - name: Collect logs
        if: always()
        run: |
          kubectl logs -n velero -l app.kubernetes.io/name=velero > velero-logs.txt
          kubectl get all -n transaction-system > resources.txt
      
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-logs
          path: |
            velero-logs.txt
            resources.txt
