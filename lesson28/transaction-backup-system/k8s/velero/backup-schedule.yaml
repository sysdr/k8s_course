apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: transaction-system-hourly
  namespace: velero
spec:
  schedule: "0 * * * *"  # Hourly backups
  template:
    includedNamespaces:
    - transaction-system
    excludedResources:
    - events
    - events.events.k8s.io
    storageLocation: default
    volumeSnapshotLocations:
    - default
    ttl: 168h0m0s  # 7 days retention
    snapshotVolumes: true
    defaultVolumesToRestic: true
    metadata:
      labels:
        backup-type: automated
        frequency: hourly
---
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: transaction-system-daily
  namespace: velero
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM
  template:
    includedNamespaces:
    - transaction-system
    excludedResources:
    - events
    storageLocation: default
    volumeSnapshotLocations:
    - default
    ttl: 720h0m0s  # 30 days retention
    snapshotVolumes: true
    defaultVolumesToRestic: true
    metadata:
      labels:
        backup-type: automated
        frequency: daily
