apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: transaction-api-authz
  namespace: transaction-system
spec:
  selector:
    matchLabels:
      app: transaction-api
  action: ALLOW
  rules:
  - from:
    - source:
        principals: ["cluster.local/ns/transaction-system/sa/transaction-frontend"]
    - source:
        namespaces: ["istio-system"]
    to:
    - operation:
        methods: ["GET", "POST", "DELETE"]
        paths: ["/api/*", "/health", "/ready", "/metrics"]
