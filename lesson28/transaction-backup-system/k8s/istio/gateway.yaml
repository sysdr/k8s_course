apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: transaction-gateway
  namespace: transaction-system
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*"
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: transaction-routes
  namespace: transaction-system
spec:
  hosts:
  - "*"
  gateways:
  - transaction-gateway
  http:
  - match:
    - uri:
        prefix: /api/
    route:
    - destination:
        host: transaction-api
        port:
          number: 8000
    timeout: 30s
    retries:
      attempts: 3
      perTryTimeout: 10s
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: transaction-frontend
        port:
          number: 8080
