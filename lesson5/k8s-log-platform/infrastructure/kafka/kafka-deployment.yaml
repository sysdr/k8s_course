apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: log-platform
spec:
  serviceName: kafka
  replicas: 3
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      initContainers:
      - name: init-broker-id
        image: busybox:1.36
        command: ['sh', '-c']
        args:
        - |
          POD_NAME=$(hostname)
          BROKER_ID=$(echo $POD_NAME | sed 's/kafka-//')
          echo $BROKER_ID > /shared/broker-id
        volumeMounts:
        - name: broker-id
          mountPath: /shared
      containers:
      - name: kafka
        image: confluentinc/cp-kafka:7.5.0
        ports:
        - containerPort: 9092
          name: kafka
        - containerPort: 9093
          name: kafka-internal
        command:
        - sh
        - -c
        - |
          BROKER_ID=$(cat /shared/broker-id)
          POD_NAME=$(hostname)
          export KAFKA_BROKER_ID=$BROKER_ID
          export KAFKA_ADVERTISED_LISTENERS="PLAINTEXT://${POD_NAME}.kafka.log-platform.svc.cluster.local:9092"
          exec /etc/confluent/docker/run
        env:
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: "zookeeper:2181"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"
        - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
          value: "true"
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        volumeMounts:
        - name: kafka-data
          mountPath: /var/lib/kafka/data
        - name: broker-id
          mountPath: /shared
      volumes:
      - name: broker-id
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: kafka-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: log-platform
spec:
  clusterIP: None
  ports:
  - port: 9092
    name: kafka
  selector:
    app: kafka
