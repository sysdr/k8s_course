apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: log-platform-ingress
  namespace: log-platform
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
  - hosts:
    - logs.example.com
    secretName: log-platform-tls
  rules:
  - host: logs.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: log-ingestion
            port:
              number: 8000
