apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-processor
  namespace: log-platform
  labels:
    app: log-processor
    version: v1
spec:
  replicas: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  selector:
    matchLabels:
      app: log-processor
  template:
    metadata:
      labels:
        app: log-processor
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
    spec:
      serviceAccountName: log-processor
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: log-processor
        image: log-processor:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8001
          name: metrics
          protocol: TCP
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka-0.kafka.log-platform.svc.cluster.local:9092"
        - name: KAFKA_TOPIC
          value: "application-logs"
        - name: KAFKA_GROUP_ID
          value: "log-processor-group"
        - name: POSTGRES_URL
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: connection-string
        - name: REDIS_URL
          value: "redis://redis.log-platform.svc.cluster.local:6379"
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            cpu: 4000m
            memory: 4Gi
