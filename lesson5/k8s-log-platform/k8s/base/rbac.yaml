apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-ingestion
  namespace: log-platform
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-processor
  namespace: log-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: log-platform-role
  namespace: log-platform
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: log-platform-rolebinding
  namespace: log-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: log-platform-role
subjects:
- kind: ServiceAccount
  name: log-ingestion
  namespace: log-platform
- kind: ServiceAccount
  name: log-processor
  namespace: log-platform
