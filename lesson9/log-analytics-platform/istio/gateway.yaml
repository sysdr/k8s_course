apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: log-analytics-gateway
  namespace: log-analytics
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*"
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: api-gateway-vs
  namespace: log-analytics
spec:
  hosts:
  - "*"
  gateways:
  - log-analytics-gateway
  http:
  - match:
    - uri:
        prefix: "/api/"
    route:
    - destination:
        host: api-gateway
        port:
          number: 8080
      weight: 100
    timeout: 30s
    retries:
      attempts: 3
      perTryTimeout: 10s
      retryOn: 5xx,reset,connect-failure,refused-stream
