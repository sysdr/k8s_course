apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: log-analytics
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: api-gateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: log-ingestion-pdb
  namespace: log-analytics
spec:
  minAvailable: 3
  selector:
    matchLabels:
      app: log-ingestion
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: log-processor-pdb
  namespace: log-analytics
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: log-processor
