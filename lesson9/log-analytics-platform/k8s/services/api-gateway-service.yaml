# ClusterIP Service for internal communication
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: log-analytics
  labels:
    app: api-gateway
    service: api-gateway
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: api-gateway
---
# NodePort Service for external development access
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-nodeport
  namespace: log-analytics
  labels:
    app: api-gateway
    service: api-gateway-external
spec:
  type: NodePort
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
    protocol: TCP
    name: http
  selector:
    app: api-gateway
---
# LoadBalancer Service for production external access
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-lb
  namespace: log-analytics
  labels:
    app: api-gateway
    service: api-gateway-loadbalancer
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: api-gateway
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
