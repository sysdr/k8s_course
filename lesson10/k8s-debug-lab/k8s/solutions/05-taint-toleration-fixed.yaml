# SOLUTION: Taint/Toleration Fixed
# Changes: Added toleration for dedicated=analytics:NoSchedule

apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-worker
  namespace: log-processor
  labels:
    app: analytics-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: analytics-worker
  template:
    metadata:
      labels:
        app: analytics-worker
    spec:
      # FIXED: Added toleration
      tolerations:
      - key: "dedicated"
        operator: "Equal"
        value: "analytics"
        effect: "NoSchedule"
      containers:
      - name: worker
        image: python:3.11-slim
        command: ["sleep", "infinity"]
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
