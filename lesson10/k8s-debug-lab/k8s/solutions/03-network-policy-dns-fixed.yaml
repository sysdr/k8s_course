# SOLUTION: NetworkPolicy DNS Fixed
# Changes: Added egress rule allowing DNS queries to kube-system

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dashboard-policy
  namespace: log-processor
spec:
  podSelector:
    matchLabels:
      app: log-dashboard
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: frontend
    ports:
    - port: 80
  egress:
  # FIXED: Allow DNS queries
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  # Allow traffic to log-api
  - to:
    - podSelector:
        matchLabels:
          app: log-api
    ports:
    - port: 8002
