# BROKEN MANIFEST - Scheduling Failure: ResourceQuota Exceeded
# Issue: Namespace quota prevents new Pods from being created
# Debug: kubectl describe resourcequota -n log-processor
# Fix: Delete existing Pods, increase quota, or reduce resource requests

apiVersion: v1
kind: ResourceQuota
metadata:
  name: log-processor-quota
  namespace: log-processor
  labels:
    debug-scenario: quota-exceeded
spec:
  hard:
    # BUG: Very restrictive quota that will be exceeded
    requests.cpu: "500m"
    requests.memory: "512Mi"
    pods: "2"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-aggregator
  namespace: log-processor
  labels:
    app: log-aggregator
    debug-scenario: quota-exceeded
spec:
  # BUG: 5 replicas x 200m = 1000m > 500m quota
  replicas: 5
  selector:
    matchLabels:
      app: log-aggregator
  template:
    metadata:
      labels:
        app: log-aggregator
    spec:
      containers:
      - name: aggregator
        image: python:3.11-slim
        command: ["sleep", "infinity"]
        resources:
          requests:
            cpu: "200m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
