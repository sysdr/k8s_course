# BROKEN MANIFEST - Scheduling Failure: Node Affinity Mismatch
# Issue: Required node label doesn't exist in cluster
# Debug: kubectl get nodes --show-labels | grep gpu-type
# Fix: Either add label to nodes or remove/modify the affinity requirement

apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-processor-gpu
  namespace: log-processor
  labels:
    app: log-processor
    debug-scenario: affinity-mismatch
spec:
  replicas: 2
  selector:
    matchLabels:
      app: log-processor
      variant: gpu
  template:
    metadata:
      labels:
        app: log-processor
        variant: gpu
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              # BUG: This label doesn't exist on any nodes in the cluster
              - key: gpu-type
                operator: In
                values:
                - nvidia-tesla-v100
                - nvidia-tesla-a100
      containers:
      - name: processor
        image: python:3.11-slim
        command: ["sleep", "infinity"]
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
