# BROKEN MANIFEST - Scheduling Failure: Missing StorageClass
# Issue: PVC references non-existent StorageClass
# Debug: kubectl get sc; kubectl describe pvc -n log-processor
# Fix: Use an existing StorageClass or create the required one

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: log-storage
  namespace: log-processor
  labels:
    debug-scenario: missing-storage-class
spec:
  # BUG: StorageClass 'premium-ssd' doesn't exist
  storageClassName: premium-ssd
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-archiver
  namespace: log-processor
  labels:
    app: log-archiver
    debug-scenario: missing-storage-class
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-archiver
  template:
    metadata:
      labels:
        app: log-archiver
    spec:
      containers:
      - name: archiver
        image: python:3.11-slim
        command: ["sleep", "infinity"]
        volumeMounts:
        - name: storage
          mountPath: /data
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: log-storage
