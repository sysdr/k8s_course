# BROKEN MANIFEST - Networking Failure: Headless Service Misuse
# Issue: Headless service used where ClusterIP is needed
# Debug: kubectl run test --rm -it --image=busybox -- nslookup log-metrics
# Fix: Remove clusterIP: None for load-balanced access

apiVersion: v1
kind: Service
metadata:
  name: log-metrics
  namespace: log-processor
  labels:
    debug-scenario: headless-misuse
spec:
  # BUG: Headless service returns Pod IPs directly
  # Clients expecting single stable IP will fail
  clusterIP: None
  selector:
    app: log-metrics
  ports:
  - port: 9090
    targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-metrics
  namespace: log-processor
  labels:
    app: log-metrics
    debug-scenario: headless-misuse
spec:
  replicas: 3
  selector:
    matchLabels:
      app: log-metrics
  template:
    metadata:
      labels:
        app: log-metrics
    spec:
      containers:
      - name: metrics
        image: python:3.11-slim
        command: ["python", "-m", "http.server", "9090"]
        ports:
        - containerPort: 9090
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
