# BROKEN MANIFEST - Networking Failure: Ingress References Missing Service
# Issue: Ingress backend points to non-existent Service
# Debug: kubectl describe ingress log-ingress -n log-processor
# Fix: Create the missing Service or correct the backend name

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: log-ingress
  namespace: log-processor
  labels:
    debug-scenario: missing-backend
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: logs.example.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            # BUG: Service 'log-api-gateway' doesn't exist
            name: log-api-gateway
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            # BUG: Service 'log-frontend' doesn't exist
            name: log-frontend
            port:
              number: 80
