apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: log-processing-gateway
  namespace: log-processing
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: log-ingestion-api-vs
  namespace: log-processing
spec:
  hosts:
    - "*"
  gateways:
    - log-processing-gateway
  http:
    - match:
        - uri:
            prefix: "/api/v1/logs"
      route:
        - destination:
            host: log-ingestion-api
            port:
              number: 8000
      timeout: 30s
      retries:
        attempts: 3
        perTryTimeout: 10s
    - match:
        - uri:
            prefix: "/"
      route:
        - destination:
            host: analytics-dashboard
            port:
              number: 80
