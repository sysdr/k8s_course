apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: log-ingestion-api-pdb
  namespace: log-processing
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: log-ingestion-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: log-processor-worker-pdb
  namespace: log-processing
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: log-processor-worker
