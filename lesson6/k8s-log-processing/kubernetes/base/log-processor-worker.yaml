apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-processor-worker
  namespace: log-processing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: log-processor-worker
  template:
    metadata:
      labels:
        app: log-processor-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
    spec:
      containers:
        - name: worker
          image: log-processor-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: DATABASE_URL
              value: "postgresql+asyncpg://loguser:logpass@timescaledb:5432/logsdb"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
