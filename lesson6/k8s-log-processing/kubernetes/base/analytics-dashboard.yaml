apiVersion: v1
kind: Service
metadata:
  name: analytics-dashboard
  namespace: log-processing
spec:
  selector:
    app: analytics-dashboard
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-dashboard
  namespace: log-processing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-dashboard
  template:
    metadata:
      labels:
        app: analytics-dashboard
    spec:
      containers:
        - name: dashboard
          image: analytics-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: REACT_APP_PROMETHEUS_URL
              value: "http://prometheus.monitoring.svc.cluster.local:9090"
            - name: REACT_APP_API_URL
              value: "http://log-ingestion-api:8000"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
