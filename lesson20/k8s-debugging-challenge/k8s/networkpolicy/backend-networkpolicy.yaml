apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-netpol
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: frontend
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: redis  # BUG #3: Missing database egress rule
    ports:
    - protocol: TCP
      port: 6379
  # Missing egress rule to database-service on port 5432
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53  # Allow DNS
