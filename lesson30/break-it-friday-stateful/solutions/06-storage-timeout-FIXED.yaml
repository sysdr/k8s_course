# FIXED VERSION of Scenario 6
# Solution: Use gradual scaling script instead of immediate 20 replicas
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cassandra
  namespace: scenario-06
spec:
  serviceName: cassandra
  replicas: 5  # FIXED: Start with 5, scale gradually
  podManagementPolicy: OrderedReady  # FIXED: Deploy sequentially
  selector:
    matchLabels:
      app: cassandra
  template:
    metadata:
      labels:
        app: cassandra
    spec:
      containers:
      - name: cassandra
        image: cassandra:4.1
        ports:
        - containerPort: 9042
        env:
        - name: CASSANDRA_SEEDS
          value: "cassandra-0.cassandra.scenario-06.svc.cluster.local"
        - name: MAX_HEAP_SIZE
          value: "512M"
        - name: HEAP_NEWSIZE
          value: "128M"
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        volumeMounts:
        - name: cassandra-data
          mountPath: /var/lib/cassandra
  volumeClaimTemplates:
  - metadata:
      name: cassandra-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: fast-ssd-retain
      resources:
        requests:
          storage: 50Gi
