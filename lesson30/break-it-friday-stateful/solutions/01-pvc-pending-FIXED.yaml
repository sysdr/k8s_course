# FIXED VERSION of Scenario 1
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: scenario-01
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_DB
          value: debugdb
        - name: POSTGRES_USER
          value: debuguser
        - name: POSTGRES_PASSWORD
          value: debugpass123
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: fast-ssd-retain  # FIXED: Correct StorageClass name
      resources:
        requests:
          storage: 5Gi
