# FIXED VERSION of Scenario 4
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: scenario-04
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      # FIXED: SecurityContext matches MongoDB's UID
      securityContext:
        runAsUser: 999  # FIXED: MongoDB's actual UID
        runAsGroup: 999
        fsGroup: 999  # FIXED: Critical for volume ownership
      containers:
      - name: mongodb
        image: mongo:6.0
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          value: admin
        - name: MONGO_INITDB_ROOT_PASSWORD
          value: adminpass123
        ports:
        - containerPort: 27017
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: mongodb-data
          mountPath: /data/db
      volumes:
      - name: mongodb-data
        persistentVolumeClaim:
          claimName: mongodb-data
