# FIXED VERSION of Scenario 3
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: scenario-03
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_DB
          value: proddb
        - name: POSTGRES_USER
          value: produser
        - name: POSTGRES_PASSWORD
          value: prodpass123
        ports:
        - containerPort: 5432
        # FIXED: Adequate memory for PostgreSQL
        resources:
          requests:
            memory: "256Mi"  # FIXED: Sufficient for initialization
            cpu: "250m"
          limits:
            memory: "512Mi"  # FIXED: Room for operations
            cpu: "500m"
        # FIXED: Proper probe timing
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - produser
          initialDelaySeconds: 30  # FIXED: Allow full initialization
          periodSeconds: 10
          failureThreshold: 6  # FIXED: More tolerant during startup
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - produser
          initialDelaySeconds: 45  # FIXED: Wait for readiness first
          periodSeconds: 15
          failureThreshold: 3
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-data
