apiVersion: v1
kind: Namespace
metadata:
  name: scenario-01
---
# BROKEN: StorageClass name doesn't exist (typo)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: scenario-01
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-ssd  # WRONG: Should be 'fast-ssd-retain'
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: scenario-01
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_DB
          value: debugdb
        - name: POSTGRES_USER
          value: debuguser
        - name: POSTGRES_PASSWORD
          value: debugpass123
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: fast-ssd  # BROKEN: Typo in StorageClass name
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: scenario-01
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
  clusterIP: None
