apiVersion: v1
kind: Namespace
metadata:
  name: scenario-05
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: scenario-05
spec:
  serviceName: redis
  replicas: 5  # Trying to deploy 5 replicas
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      # BROKEN: requiredDuringSchedulingIgnoredDuringExecution is too strict
      # for a 3-node cluster trying to deploy 5 pods
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:  # WRONG: Should be preferred
          - labelSelector:
              matchLabels:
                app: redis
            topologyKey: kubernetes.io/hostname  # One pod per node REQUIRED
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        volumeMounts:
        - name: redis-data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: redis-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: fast-ssd-retain
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: scenario-05
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
  clusterIP: None
