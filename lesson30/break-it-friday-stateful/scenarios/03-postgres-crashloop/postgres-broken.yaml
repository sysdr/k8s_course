apiVersion: v1
kind: Namespace
metadata:
  name: scenario-03
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: scenario-03
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-ssd-retain
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: scenario-03
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_DB
          value: proddb
        - name: POSTGRES_USER
          value: produser
        - name: POSTGRES_PASSWORD
          value: prodpass123
        ports:
        - containerPort: 5432
        # BROKEN: Memory limit too low for PostgreSQL initialization
        resources:
          requests:
            memory: "64Mi"  # WRONG: Way too low
            cpu: "100m"
          limits:
            memory: "128Mi"  # WRONG: PostgreSQL needs ~256Mi minimum
            cpu: "200m"
        # BROKEN: Readiness probe timing wrong
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - produser
          initialDelaySeconds: 5  # WRONG: PostgreSQL takes ~30s to initialize
          periodSeconds: 5
          failureThreshold: 2  # WRONG: Too aggressive, kills pod during startup
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - produser
          initialDelaySeconds: 10  # WRONG: Also too short
          periodSeconds: 10
          failureThreshold: 3
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: scenario-03
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
  clusterIP: None
