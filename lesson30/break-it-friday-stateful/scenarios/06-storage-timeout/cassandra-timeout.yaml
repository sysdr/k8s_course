apiVersion: v1
kind: Namespace
metadata:
  name: scenario-06
---
# BROKEN: Attempting to create 20 large volumes simultaneously
# will trigger cloud provider API rate limiting
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cassandra
  namespace: scenario-06
spec:
  serviceName: cassandra
  replicas: 20  # WRONG: Creating 20 PVCs at once causes rate limiting
  selector:
    matchLabels:
      app: cassandra
  template:
    metadata:
      labels:
        app: cassandra
    spec:
      containers:
      - name: cassandra
        image: cassandra:4.1
        ports:
        - containerPort: 9042
        env:
        - name: CASSANDRA_SEEDS
          value: "cassandra-0.cassandra.scenario-06.svc.cluster.local"
        - name: MAX_HEAP_SIZE
          value: "512M"
        - name: HEAP_NEWSIZE
          value: "128M"
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        volumeMounts:
        - name: cassandra-data
          mountPath: /var/lib/cassandra
  # Each replica requests 50Gi = 1TB total provisioning
  volumeClaimTemplates:
  - metadata:
      name: cassandra-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: fast-ssd-retain
      resources:
        requests:
          storage: 50Gi  # Large volume multiplied by 20 replicas
---
apiVersion: v1
kind: Service
metadata:
  name: cassandra
  namespace: scenario-06
spec:
  selector:
    app: cassandra
  ports:
  - port: 9042
    targetPort: 9042
  clusterIP: None
