apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-ingestor
  namespace: log-processing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: log-ingestor
  template:
    metadata:
      labels:
        app: log-ingestor
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
      - name: log-ingestor
        image: log-ingestor:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: log-ingestor
  namespace: log-processing
spec:
  ports:
  - port: 8080
  selector:
    app: log-ingestor
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: log-ingestor-hpa
  namespace: log-processing
spec:
  scaleTargetRef:
    kind: Deployment
    name: log-ingestor
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
