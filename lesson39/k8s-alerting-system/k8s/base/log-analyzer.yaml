apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-analyzer
  namespace: log-processing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-analyzer
  template:
    metadata:
      labels:
        app: log-analyzer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
      - name: log-analyzer
        image: log-analyzer:latest
        imagePullPolicy: Never
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
---
apiVersion: v1
kind: Service
metadata:
  name: log-analyzer
  namespace: log-processing
spec:
  ports:
  - port: 8080
  selector:
    app: log-analyzer
