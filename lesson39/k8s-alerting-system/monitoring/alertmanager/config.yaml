global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: [cluster, alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: critical-alerts
      group_wait: 0s

receivers:
  - name: default
    webhook_configs:
    - url: http://localhost:9093/debug
  
  - name: critical-alerts
    webhook_configs:
    - url: http://localhost:9093/debug
      send_resolved: true
