<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="k8sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#326CE5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A90E2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="testGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="serviceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6D28D9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1400" height="1000" fill="#F8FAFC"/>
  
  <!-- Title -->
  <text x="700" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1E293B">
    Kubernetes Automated Testing Platform Architecture
  </text>
  <text x="700" y="70" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#64748B">
    Production Test Orchestration with Jobs, Quality Gates, and Result Aggregation
  </text>

  <!-- Kubernetes Cluster Boundary -->
  <rect x="50" y="100" width="1300" height="850" rx="10" fill="none" stroke="#326CE5" stroke-width="3" stroke-dasharray="10,5"/>
  <text x="70" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#326CE5">
    Kubernetes Cluster (Namespace: ecommerce)
  </text>

  <!-- Services Section -->
  <g id="services">
    <!-- Product Service -->
    <rect x="100" y="180" width="200" height="140" rx="8" fill="url(#serviceGrad)" filter="url(#shadow)"/>
    <text x="200" y="210" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Product Service
    </text>
    <text x="200" y="235" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
      Port: 8000
    </text>
    <text x="200" y="255" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      Replicas: 2
    </text>
    <text x="200" y="275" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      HPA: 2-10 pods
    </text>
    <text x="200" y="295" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      Redis Caching
    </text>

    <!-- Order Service -->
    <rect x="350" y="180" width="200" height="140" rx="8" fill="url(#serviceGrad)" filter="url(#shadow)"/>
    <text x="450" y="210" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Order Service
    </text>
    <text x="450" y="235" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
      Port: 8001
    </text>
    <text x="450" y="255" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      Replicas: 2
    </text>
    <text x="450" y="275" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      Orchestration Logic
    </text>

    <!-- Payment Service -->
    <rect x="600" y="180" width="200" height="140" rx="8" fill="url(#serviceGrad)" filter="url(#shadow)"/>
    <text x="700" y="210" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Payment Service
    </text>
    <text x="700" y="235" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
      Port: 8002
    </text>
    <text x="700" y="255" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      Replicas: 2
    </text>
    <text x="700" y="275" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      Payment Processing
    </text>

    <!-- Redis -->
    <rect x="850" y="180" width="150" height="100" rx="8" fill="#DC2626" filter="url(#shadow)"/>
    <text x="925" y="210" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Redis
    </text>
    <text x="925" y="235" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
      Caching Layer
    </text>
    <text x="925" y="255" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      Port: 6379
    </text>
  </g>

  <!-- Service Communication Arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Order → Product -->
  <line x1="350" y1="250" x2="300" y2="250" stroke="#64748B" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="325" y="240" font-family="Arial, sans-serif" font-size="9" fill="#64748B">HTTP</text>

  <!-- Order → Payment -->
  <line x1="550" y1="250" x2="600" y2="250" stroke="#64748B" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="575" y="240" font-family="Arial, sans-serif" font-size="9" fill="#64748B">HTTP</text>

  <!-- Product → Redis -->
  <line x1="300" y1="230" x2="850" y2="230" stroke="#DC2626" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
  <text x="575" y="220" font-family="Arial, sans-serif" font-size="9" fill="#DC2626">Cache</text>

  <!-- Test Infrastructure Section -->
  <g id="test-infrastructure">
    <!-- Test Results Aggregator -->
    <rect x="1050" y="180" width="250" height="140" rx="8" fill="#F59E0B" filter="url(#shadow)"/>
    <text x="1175" y="210" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Test Results Aggregator
    </text>
    <text x="1175" y="235" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
      Port: 8003
    </text>
    <text x="1175" y="255" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      Centralized Results
    </text>
    <text x="1175" y="275" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      Quality Gate Checks
    </text>
    <text x="1175" y="295" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      ConfigMap Storage
    </text>
  </g>

  <!-- Test Jobs Section -->
  <g id="test-jobs">
    <text x="100" y="380" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#10B981">
      Automated Test Jobs
    </text>

    <!-- Smoke Tests Job -->
    <rect x="100" y="400" width="200" height="120" rx="8" fill="url(#testGrad)" filter="url(#shadow)"/>
    <text x="200" y="425" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
      Smoke Tests Job
    </text>
    <text x="200" y="445" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      backoffLimit: 0
    </text>
    <text x="200" y="460" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      Timeout: 5m
    </text>
    <text x="200" y="475" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      Health Checks
    </text>
    <text x="200" y="490" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      Service Availability
    </text>
    <text x="200" y="510" font-family="Arial, sans-serif" font-size="9" font-style="italic" text-anchor="middle" fill="white">
      Phase 1: Fast Fail
    </text>

    <!-- Integration Tests Job -->
    <rect x="350" y="400" width="200" height="120" rx="8" fill="url(#testGrad)" filter="url(#shadow)"/>
    <text x="450" y="425" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
      Integration Tests Job
    </text>
    <text x="450" y="445" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      backoffLimit: 0
    </text>
    <text x="450" y="460" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      Timeout: 10m
    </text>
    <text x="450" y="475" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      Order Flow Tests
    </text>
    <text x="450" y="490" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      Service Communication
    </text>
    <text x="450" y="510" font-family="Arial, sans-serif" font-size="9" font-style="italic" text-anchor="middle" fill="white">
      Phase 2: E2E Validation
    </text>

    <!-- Performance Tests Job -->
    <rect x="600" y="400" width="200" height="120" rx="8" fill="url(#testGrad)" filter="url(#shadow)"/>
    <text x="700" y="425" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
      Performance Tests Job
    </text>
    <text x="700" y="445" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      backoffLimit: 0
    </text>
    <text x="700" y="460" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      Timeout: 15m
    </text>
    <text x="700" y="475" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      Load Testing (k6)
    </text>
    <text x="700" y="490" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      50 VUs, 5min
    </text>
    <text x="700" y="510" font-family="Arial, sans-serif" font-size="9" font-style="italic" text-anchor="middle" fill="white">
      Phase 3: Performance
    </text>

    <!-- CronJob -->
    <rect x="850" y="400" width="200" height="120" rx="8" fill="#6366F1" filter="url(#shadow)"/>
    <text x="950" y="425" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
      Nightly Test CronJob
    </text>
    <text x="950" y="445" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      Schedule: 0 2 * * *
    </text>
    <text x="950" y="460" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      Orchestrates All Tests
    </text>
    <text x="950" y="475" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      Sequential Execution
    </text>
    <text x="950" y="490" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      Quality Gate Check
    </text>
    <text x="950" y="510" font-family="Arial, sans-serif" font-size="9" font-style="italic" text-anchor="middle" fill="white">
      Continuous Validation
    </text>
  </g>

  <!-- Test Flow Arrows -->
  <!-- Tests → Services -->
  <line x1="200" y1="400" x2="200" y2="320" stroke="#10B981" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
  <line x1="450" y1="400" x2="450" y2="320" stroke="#10B981" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
  <line x1="700" y1="400" x2="700" y2="320" stroke="#10B981" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>

  <!-- Tests → Aggregator -->
  <path d="M 300 460 Q 600 350 1050 250" stroke="#F59E0B" stroke-width="2" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
  <text x="650" y="380" font-family="Arial, sans-serif" font-size="9" fill="#F59E0B">Submit Results</text>

  <!-- Quality Gate Section -->
  <g id="quality-gate">
    <rect x="100" y="600" width="1200" height="180" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/>
    <text x="700" y="630" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1E293B">
      Quality Gate Pipeline
    </text>

    <!-- Gate Step 1 -->
    <rect x="150" y="660" width="180" height="90" rx="6" fill="white" stroke="#10B981" stroke-width="2"/>
    <text x="240" y="685" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#10B981">
      Collect Results
    </text>
    <text x="240" y="705" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#64748B">
      Aggregate from Jobs
    </text>
    <text x="240" y="720" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#64748B">
      Parse ConfigMaps
    </text>
    <text x="240" y="735" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#64748B">
      Calculate Metrics
    </text>

    <!-- Arrow -->
    <line x1="330" y1="705" x2="380" y2="705" stroke="#64748B" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- Gate Step 2 -->
    <rect x="400" y="660" width="180" height="90" rx="6" fill="white" stroke="#10B981" stroke-width="2"/>
    <text x="490" y="685" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#10B981">
      Check Thresholds
    </text>
    <text x="490" y="705" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#64748B">
      Pass Rate ≥ 95%
    </text>
    <text x="490" y="720" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#64748B">
      Failed Tests = 0
    </text>
    <text x="490" y="735" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#64748B">
      P95 Latency < 500ms
    </text>

    <!-- Arrow -->
    <line x1="580" y1="705" x2="630" y2="705" stroke="#64748B" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- Gate Step 3 -->
    <rect x="650" y="660" width="180" height="90" rx="6" fill="white" stroke="#10B981" stroke-width="2"/>
    <text x="740" y="685" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#10B981">
      Gate Decision
    </text>
    <text x="740" y="705" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#64748B">
      ✓ Pass → Deploy
    </text>
    <text x="740" y="720" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#64748B">
      ✗ Fail → Block
    </text>
    <text x="740" y="735" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#64748B">
      Alert Team
    </text>

    <!-- Arrow -->
    <line x1="830" y1="705" x2="880" y2="705" stroke="#64748B" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- Deployment -->
    <rect x="900" y="660" width="180" height="90" rx="6" fill="white" stroke="#3B82F6" stroke-width="2"/>
    <text x="990" y="685" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#3B82F6">
      Production Deploy
    </text>
    <text x="990" y="705" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#64748B">
      Rolling Update
    </text>
    <text x="990" y="720" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#64748B">
      Zero Downtime
    </text>
    <text x="990" y="735" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#64748B">
      Monitor Rollout
    </text>
  </g>

  <!-- Key Insights Box -->
  <g id="insights">
    <rect x="100" y="830" width="1200" height="100" rx="8" fill="#EEF2FF" stroke="#818CF8" stroke-width="2"/>
    <text x="700" y="860" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#4C1D95">
      🎯 Production Testing Patterns
    </text>
    <text x="120" y="885" font-family="Arial, sans-serif" font-size="11" fill="#4C1D95">
      • Jobs provide completion semantics - tests must finish successfully or fail explicitly
    </text>
    <text x="120" y="905" font-family="Arial, sans-serif" font-size="11" fill="#4C1D95">
      • backoffLimit: 0 prevents retry masking - failures should fail immediately
    </text>
    <text x="700" y="885" font-family="Arial, sans-serif" font-size="11" fill="#4C1D95">
      • Quality gates block bad deployments - 95% pass rate required for production
    </text>
    <text x="700" y="905" font-family="Arial, sans-serif" font-size="11" fill="#4C1D95">
      • Test orchestration scales to 1000s of tests/day - Google runs 5.5B tests daily
    </text>
  </g>

  <!-- Legend -->
  <g id="legend">
    <text x="100" y="970" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#64748B">Legend:</text>
    
    <rect x="200" y="960" width="15" height="15" fill="url(#serviceGrad)"/>
    <text x="220" y="972" font-family="Arial, sans-serif" font-size="10" fill="#64748B">Microservices</text>
    
    <rect x="350" y="960" width="15" height="15" fill="url(#testGrad)"/>
    <text x="370" y="972" font-family="Arial, sans-serif" font-size="10" fill="#64748B">Test Jobs</text>
    
    <rect x="500" y="960" width="15" height="15" fill="#F59E0B"/>
    <text x="520" y="972" font-family="Arial, sans-serif" font-size="10" fill="#64748B">Test Infrastructure</text>
    
    <line x1="650" y1="967" x2="680" y2="967" stroke="#64748B" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="685" y="972" font-family="Arial, sans-serif" font-size="10" fill="#64748B">Service Communication</text>
    
    <line x1="850" y1="967" x2="880" y2="967" stroke="#10B981" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
    <text x="885" y="972" font-family="Arial, sans-serif" font-size="10" fill="#64748B">Test Execution</text>
  </g>
</svg>
