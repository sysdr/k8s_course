apiVersion: batch/v1
kind: Job
metadata:
  name: smoke-tests
  namespace: ecommerce
  labels:
    test-suite: smoke
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300  # 5 minute timeout
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        test-suite: smoke
    spec:
      serviceAccountName: ecommerce-sa
      restartPolicy: Never
      containers:
      - name: smoke-test
        image: curlimages/curl:latest
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            echo "Running smoke tests..."
            
            # Test product service
            curl -f http://product-service:8000/health || exit 1
            curl -f http://product-service:8000/api/v1/products || exit 1
            
            # Test order service
            curl -f http://order-service:8001/health || exit 1
            
            # Test payment service
            curl -f http://payment-service:8002/health || exit 1
            
            echo "All smoke tests passed!"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
