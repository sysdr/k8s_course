apiVersion: batch/v1
kind: Job
metadata:
  name: integration-tests
  namespace: ecommerce
  labels:
    test-suite: integration
spec:
  backoffLimit: 0  # Don't retry failed tests
  activeDeadlineSeconds: 600  # 10 minute timeout
  ttlSecondsAfterFinished: 3600  # Cleanup after 1 hour
  template:
    metadata:
      labels:
        test-suite: integration
    spec:
      serviceAccountName: ecommerce-sa
      restartPolicy: Never
      containers:
      - name: test-runner
        image: test-runner:latest
        imagePullPolicy: Never
        command: ["python", "-m", "pytest"]
        args:
          - "tests/integration/"
          - "-v"
          - "--json-report"
          - "--json-report-file=/tmp/test-results.json"
        env:
        - name: JOB_NAME
          value: "integration-tests"
        - name: PRODUCT_SERVICE_URL
          value: "http://product-service:8000"
        - name: ORDER_SERVICE_URL
          value: "http://order-service:8001"
        - name: PAYMENT_SERVICE_URL
          value: "http://payment-service:8002"
        - name: TEST_RESULTS_URL
          value: "http://test-results-aggregator:8003"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
