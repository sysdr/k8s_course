# Default values for e-commerce-platform

namespace: ecommerce

productService:
  image:
    repository: product-service
    tag: latest
    pullPolicy: Never
  replicas: 2
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilization: 70

orderService:
  image:
    repository: order-service
    tag: latest
    pullPolicy: Never
  replicas: 2
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"

paymentService:
  image:
    repository: payment-service
    tag: latest
    pullPolicy: Never
  replicas: 2
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"

redis:
  enabled: true
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

testing:
  enabled: true
  runOnDeploy: true
  qualityGateThreshold: 95
  testSuites:
    - name: smoke
      timeout: 300
    - name: integration
      timeout: 600
    - name: performance
      timeout: 900

monitoring:
  enabled: true
  prometheus:
    enabled: true
  grafana:
    enabled: true

istio:
  enabled: true
  mtls:
    mode: STRICT
