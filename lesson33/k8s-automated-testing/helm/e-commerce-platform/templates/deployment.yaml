{{- range $service := list "product" "order" "payment" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $service }}-service
  namespace: {{ $.Values.namespace }}
  labels:
    app: {{ $service }}-service
spec:
  replicas: {{ index $.Values (printf "%sService" $service) "replicas" }}
  selector:
    matchLabels:
      app: {{ $service }}-service
  template:
    metadata:
      labels:
        app: {{ $service }}-service
        version: v1
    spec:
      serviceAccountName: ecommerce-sa
      containers:
      - name: {{ $service }}-service
        image: {{ index $.Values (printf "%sService" $service) "image" "repository" }}:{{ index $.Values (printf "%sService" $service) "image" "tag" }}
        imagePullPolicy: {{ index $.Values (printf "%sService" $service) "image" "pullPolicy" }}
        ports:
        - containerPort: {{ add 8000 (index (dict "product" 0 "order" 1 "payment" 2) $service) }}
        resources:
{{ toYaml (index $.Values (printf "%sService" $service) "resources") | indent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: {{ add 8000 (index (dict "product" 0 "order" 1 "payment" 2) $service) }}
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: {{ add 8000 (index (dict "product" 0 "order" 1 "payment" 2) $service) }}
          initialDelaySeconds: 10
          periodSeconds: 5
{{- end }}
