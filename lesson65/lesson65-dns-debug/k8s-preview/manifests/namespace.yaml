# - Kubernetes: Service object creates a stable DNS entry in CoreDNS
#   Format: <service-name>.<namespace>.svc.cluster.local
apiVersion: v1
kind: Namespace
metadata:
  name: log-processing
  labels:
    app.kubernetes.io/part-of: lesson65-preview
