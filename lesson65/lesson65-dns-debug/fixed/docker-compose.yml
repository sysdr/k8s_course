# =============================================================================
# FIXED docker-compose.yml — Lesson 65 Break-It-Friday
#
# All three bugs from the broken version are resolved here.
#
# FIX #1: api-service is now attached to BOTH frontend-net and backend-net.
#         It can now resolve log-processor's DNS name and the "processor" alias.
#
# FIX #2: The alias "processor" is correctly defined under
#         networks.backend-net.aliases within the log-processor service block.
#         This is the only valid location for network-scoped aliases.
#
# FIX #3: depends_on now uses condition: service_healthy.
#         api-service will not start until log-processor's healthcheck passes.
#         This eliminates the race condition on startup.
# =============================================================================

version: "3.9"

networks:
  frontend-net:
    driver: bridge
    name: lesson65-frontend
  backend-net:
    driver: bridge
    name: lesson65-backend

services:
  api-service:
    build:
      context: ./api-service
      dockerfile: Dockerfile
    container_name: lesson65-api
    ports:
      - "8000:8000"
    environment:
      - LOG_PROCESSOR_URL=http://processor:8080
    # FIX #1: api-service now attached to both networks
    networks:
      - frontend-net
      - backend-net
    # FIX #3: wait until log-processor healthcheck passes
    depends_on:
      log-processor:
        condition: service_healthy
    restart: unless-stopped

  log-processor:
    build:
      context: ./log-processor
      dockerfile: Dockerfile
    container_name: lesson65-processor
    ports:
      - "8080:8080"
    # FIX #2: aliases defined correctly under the network attachment
    networks:
      backend-net:
        aliases:
          - processor
          - log-svc
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
