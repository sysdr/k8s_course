apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-processor
  namespace: devsecops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: log-processor
  template:
    metadata:
      labels:
        app: log-processor
    spec:
      serviceAccountName: log-processor-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: log-processor
        image: log-processor:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8002
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "400m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8002
        readinessProbe:
          httpGet:
            path: /health
            port: 8002
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: log-processor
  namespace: devsecops
spec:
  selector:
    app: log-processor
  ports:
  - port: 8002
    targetPort: 8002
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-processor-sa
  namespace: devsecops
