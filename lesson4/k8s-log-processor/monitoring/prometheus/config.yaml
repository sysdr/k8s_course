global:
  scrape_interval: 15s
scrape_configs:
  - job_name: 'log-ingestion'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - log-processor
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: log-ingestion
  - job_name: 'log-analytics'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - log-processor
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: log-analytics
