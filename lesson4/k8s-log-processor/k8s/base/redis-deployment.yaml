apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: log-processor
spec:
  serviceName: redis-service
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: log-processor
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
