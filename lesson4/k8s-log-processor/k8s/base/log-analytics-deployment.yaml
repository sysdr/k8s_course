apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-analytics
  namespace: log-processor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: log-analytics
  template:
    metadata:
      labels:
        app: log-analytics
    spec:
      containers:
      - name: analytics
        image: log-analytics:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8001
        env:
        - name: REDIS_HOST
          value: "redis-service"
        - name: REDIS_PORT
          value: "6379"
---
apiVersion: v1
kind: Service
metadata:
  name: log-analytics-service
  namespace: log-processor
spec:
  selector:
    app: log-analytics
  ports:
  - port: 80
    targetPort: 8001
