apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: log-processor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
      - name: dashboard
        image: dashboard:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        env:
        - name: REACT_APP_ANALYTICS_API
          value: "http://log-analytics-service"
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-service
  namespace: log-processor
spec:
  type: NodePort
  selector:
    app: dashboard
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
