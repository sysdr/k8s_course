apiVersion: v1
kind: Service
metadata:
  name: postgres-rw
  namespace: database
  labels:
    app: postgres
    component: database
    role: primary
spec:
  type: ClusterIP
  selector:
    app: postgres
    component: database
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgresql
  sessionAffinity: ClientIP
