# Default values for postgres-ha

postgresql:
  replicaCount: 3
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  
  resources:
    requests:
      memory: "2Gi"
      cpu: "1000m"
    limits:
      memory: "4Gi"
      cpu: "2000m"
  
  persistence:
    enabled: true
    storageClass: "fast-ssd"
    size: 50Gi
    accessMode: ReadWriteOnce
  
  auth:
    username: postgres
    password: "#CHANGEME#"
    database: appdb

pgbouncer:
  enabled: true
  replicaCount: 3
  image:
    repository: pgbouncer/pgbouncer
    tag: "1.21.0"
  
  resources:
    requests:
      memory: "64Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"
  
  poolMode: transaction
  maxClientConn: 1000
  defaultPoolSize: 25

monitoring:
  enabled: true
  prometheus:
    enabled: true
  grafana:
    enabled: true

istio:
  enabled: true
  mtls:
    mode: STRICT

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
