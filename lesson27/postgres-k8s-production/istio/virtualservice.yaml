apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: postgres-dashboard
  namespace: services
spec:
  hosts:
  - "*"
  gateways:
  - postgres-dashboard-gateway
  http:
  - match:
    - uri:
        prefix: /api
    route:
    - destination:
        host: database-api
        port:
          number: 8000
    timeout: 30s
    retries:
      attempts: 3
      perTryTimeout: 10s
      retryOn: 5xx,reset,connect-failure,refused-stream
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: frontend
        port:
          number: 80
