# Default values for log-analytics

replicaCount:
  logIngestion: 3
  analyticsEngine: 2
  dashboard: 2

image:
  repository: docker.io/yourorg
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: logs.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: logs-tls
      hosts:
        - logs.example.com

resources:
  logIngestion:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "1000m"
  analyticsEngine:
    requests:
      memory: "512Mi"
      cpu: "300m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

postgresql:
  enabled: true
  auth:
    username: postgres
    password: postgres
    database: logs

kafka:
  enabled: true
  replicaCount: 3

redis:
  enabled: true
  architecture: standalone

monitoring:
  enabled: true
  prometheus:
    enabled: true
  grafana:
    enabled: true

istio:
  enabled: true
  mtls:
    mode: STRICT
