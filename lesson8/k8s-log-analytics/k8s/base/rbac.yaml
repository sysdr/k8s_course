apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-ingestion-sa
  namespace: log-analytics
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: analytics-engine-sa
  namespace: log-analytics
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: log-ingestion-role
  namespace: log-analytics
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: log-ingestion-rolebinding
  namespace: log-analytics
subjects:
- kind: ServiceAccount
  name: log-ingestion-sa
  namespace: log-analytics
roleRef:
  kind: Role
  name: log-ingestion-role
  apiGroup: rbac.authorization.k8s.io
