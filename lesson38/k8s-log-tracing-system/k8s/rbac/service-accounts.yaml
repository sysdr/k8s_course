---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-ingestor-sa
  namespace: app
  annotations:
    # Workload Identity annotation for GKE / cloud provider integration
    iam.gke.io/gcp-service-account: log-ingestor@PROJECT_ID.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-processor-sa
  namespace: app
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: analytics-sa
  namespace: app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: log-app-reader
rules:
  - apiGroups: [""]
    resources:  ["configmaps", "secrets"]
    verbs:      ["get", "list", "watch"]
  - apiGroups: [""]
    resources:  ["pods"]
    verbs:      ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: log-app-reader-binding
subjects:
  - kind: ServiceAccount
    name: log-ingestor-sa
    namespace: app
  - kind: ServiceAccount
    name: log-processor-sa
    namespace: app
  - kind: ServiceAccount
    name: analytics-sa
    namespace: app
roleRef:
  kind: ClusterRole
  name: log-app-reader
  apiGroup: rbac.authorization.k8s.io
