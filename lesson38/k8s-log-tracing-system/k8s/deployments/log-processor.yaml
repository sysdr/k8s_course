apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-processor
  namespace: app
  labels:
    app: log-processor
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: log-processor
  template:
    metadata:
      labels:
        app: log-processor
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "8001"
        prometheus.io/path:   "/metrics"
    spec:
      serviceAccountName: log-processor-sa
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: log-processor
      containers:
        - name: log-processor
          image: log-processor:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
              name: http
          resources:
            requests:
              cpu:    "150m"
              memory: "192Mi"
            limits:
              cpu:    "600m"
              memory: "384Mi"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key:  DATABASE_URL
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key:  KAFKA_BROKERS
            - name: OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key:  OTLP_ENDPOINT
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 8
            periodSeconds:       10
            failureThreshold:    3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds:       5
            failureThreshold:    2
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 3"]
      securityContext:
        runAsNonRoot: true
        runAsUser:    1000
        fsGroup:      1000
