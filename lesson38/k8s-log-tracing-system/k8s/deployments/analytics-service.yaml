apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: app
  labels:
    app: analytics-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "8002"
        prometheus.io/path:   "/metrics"
    spec:
      serviceAccountName: analytics-sa
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: analytics-service
      containers:
        - name: analytics-service
          image: analytics-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
              name: http
          resources:
            requests:
              cpu:    "100m"
              memory: "128Mi"
            limits:
              cpu:    "400m"
              memory: "256Mi"
          env:
            - name: REDIS_URL
              value: "redis://redis.messaging.svc.cluster.local:6379/0"
            - name: OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key:  OTLP_ENDPOINT
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds:       10
            failureThreshold:    3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 2
            periodSeconds:       5
            failureThreshold:    2
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 2"]
      securityContext:
        runAsNonRoot: true
        runAsUser:    1000
        fsGroup:      1000
