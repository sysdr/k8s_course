# docker-compose.yaml — full local stack without Kubernetes.
# Useful for rapid iteration before pushing to kind.
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_started
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]

  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: logs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d logs"]
      interval: 5s

  jaeger:
    image: jaegertracing/all-in-one:1.52
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  log-ingestor:
    build: ./src/log-ingestor
    ports: ["8000:8000"]
    depends_on:
      kafka:
        condition: service_healthy
      jaeger:
        condition: service_started
    environment:
      KAFKA_BROKERS: "kafka:29092"
      OTLP_ENDPOINT: "http://jaeger:4317"

  log-processor:
    build: ./src/log-processor
    ports: ["8001:8001"]
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
    environment:
      DATABASE_URL: "postgresql://appuser:${POSTGRES_PASSWORD:-changeme}@postgres:5432/logs"
      KAFKA_BROKERS: "kafka:29092"
      REDIS_URL: "redis://redis:6379/0"
      OTLP_ENDPOINT: "http://jaeger:4317"

  analytics-service:
    build: ./src/analytics-service
    ports: ["8002:8002"]
    depends_on:
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    environment:
      REDIS_URL: "redis://redis:6379/0"
      OTLP_ENDPOINT: "http://jaeger:4317"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import httpx; httpx.get(\"http://localhost:8002/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5

  frontend:
    build: ./src/frontend
    ports: ["3000:80"]
    depends_on:
      analytics-service:
        condition: service_healthy
