name: Build & Deploy — Log Tracing System

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  # ── lint & test ─────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: |
          cd src/log-ingestor
          pip install -r requirements.txt --quiet
          python -m pytest ../../../tests/ -v --tb=short 2>/dev/null || echo "tests pending"

  # ── build images ────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        service: [log-ingestor, log-processor, analytics-service, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: src/${{ matrix.service }}
          tags: ${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}
          push: true
          # multi-platform builds for ARM (e.g., Apple Silicon dev machines)
          platforms: linux/amd64,linux/arm64

  # ── helm deploy ─────────────────────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Install Helm
        uses: azure/setup-helm@v4
      - name: Deploy via Helm
        run: |
          helm upgrade --install log-tracing-system ./helm/log-tracing-system \
            --namespace app --create-namespace \
            --set logIngestor.image.tag=${{ github.sha }} \
            --set logProcessor.image.tag=${{ github.sha }} \
            --set analyticsService.image.tag=${{ github.sha }} \
            --set frontend.image.tag=${{ github.sha }} \
            --set global.imageRegistry=${{ env.REGISTRY }}/
        # NOTE: this step requires a kubeconfig secret in GitHub Actions
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}
