apiVersion: skaffold/v2beta29
kind: Config
metadata:
  name: log-tracing-system
build:
  artifacts:
    - image: log-ingestor
      context: src/log-ingestor
    - image: log-processor
      context: src/log-processor
    - image: analytics-service
      context: src/analytics-service
    - image: frontend
      context: src/frontend
  # push to kind cluster directly — no registry needed during dev
  tagPolicy:
    sha256: {}
deploy:
  kubectl:
    manifests:
      - k8s/namespaces/*.yaml
      - k8s/rbac/*.yaml
      - k8s/configmaps/*.yaml
      - k8s/secrets/*.yaml
      - k8s/deployments/*.yaml
      - k8s/services/*.yaml
      - k8s/autoscaling/*.yaml
      - k8s/pdb/*.yaml
      - k8s/networking/*.yaml
      - k8s/ingress/*.yaml
      - istio/*.yaml
portForward:
  - resourceType: service
    resourceName: frontend
    namespace: app
    localPort: 8080
    port: 80
  - resourceType: service
    resourceName: log-ingestor
    namespace: app
    localPort: 8000
    port: 8000
  - resourceType: service
    resourceName: jaeger-query
    namespace: observability
    localPort: 16686
    port: 16686
