# Alertmanager routing tree — preview for Lesson 39.
# route.receiver is the fallback; children match on labels and escalate.
route:
  receiver: default
  group_by: ["alertname", "namespace"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: oncall-critical
      group_wait: 10s
      continue: true              # keep matching child routes
    - match:
        severity: warning
      receiver: slack-warnings

receivers:
  - name: default
    email_configs:
      - to: "platform-alerts@example.com"
        from: "alertmanager@example.com"
        smarthost: "smtp.example.com:587"

  - name: oncall-critical
    pagerdutie_configs:
      - routing_key: "PAGERDUTY_INTEGRATION_KEY"
        description: "{{ .CommonAnnotations.summary }}"
        severity: critical
    slack_configs:
      - channel: "#incidents"
        text: "🔴 CRITICAL: {{ .CommonAnnotations.summary }}"

  - name: slack-warnings
    slack_configs:
      - channel: "#platform-warnings"
        text: "🟡 WARNING: {{ .CommonAnnotations.summary }}"

inhibit_rules:
  # If a critical alert fires, suppress the warning version of the same alert
  - source_matchers:
      - severity=critical
    target_matchers:
      - severity=warning
    equal: ["alertname"]
