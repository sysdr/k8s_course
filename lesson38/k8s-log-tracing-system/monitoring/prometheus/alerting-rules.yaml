apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: log-system-alerts
  namespace: observability
  labels:
    release: prometheus
spec:
  groups:
    - name: log-tracing-system
      interval: 30s
      rules:
        # ── Lesson 39 preview: these rules fire in Alertmanager ──────────
        - alert: IngestorHighLatency
          expr: histogram_quantile(0.99, sum(rate(log_ingestor_ingest_latency_seconds_bucket[5m])) by (le, service)) > 0.5
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Ingestor P99 latency > 500 ms for {{ $labels.service }}"

        - alert: KafkaProduceErrors
          expr: rate(log_ingestor_kafka_produce_errors_total[5m]) > 0.1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Kafka produce error rate elevated"

        - alert: ProcessorDown
          expr: up{job="log-processor"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Log processor instance is down"

        - alert: HighMemoryUsage
          expr: (container_memory_working_set_bytes{namespace="app"} / container_memory_limit_bytes{namespace="app"}) > 0.85
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "Container memory near limit in {{ $labels.pod }}"
