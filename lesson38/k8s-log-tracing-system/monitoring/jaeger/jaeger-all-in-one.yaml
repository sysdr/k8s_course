# Jaeger all-in-one deployment.
# In-memory store: suitable for development + initial validation.
# Production: replace with Elasticsearch backend (see values.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger-all-in-one
  namespace: observability
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.52
          ports:
            - containerPort: 6831   # UDP: Thrift compact (agent)
              protocol: UDP
            - containerPort: 6832   # UDP: Thrift binary
              protocol: UDP
            - containerPort: 14268  # HTTP: collector (Thrift)
            - containerPort: 14250  # gRPC: collector
            - containerPort: 16686  # HTTP: query UI
            - containerPort: 4317   # gRPC: OTLP receiver
            - containerPort: 4318   # HTTP: OTLP receiver
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          resources:
            requests:
              cpu:    "200m"
              memory: "256Mi"
            limits:
              cpu:    "1"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 5
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-collector
  namespace: observability
spec:
  selector:
    app: jaeger
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: thrift-http
      port: 14268
      targetPort: 14268
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-query
  namespace: observability
  annotations:
    # expose the query UI via ingress or port-forward
    ingress.kubernetes.io/path: /jaeger
spec:
  type: ClusterIP
  selector:
    app: jaeger
  ports:
    - name: query-http
      port: 16686
      targetPort: 16686
