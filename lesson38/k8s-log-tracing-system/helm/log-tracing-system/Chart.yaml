apiVersion: v2
name: log-tracing-system
description: Production Kubernetes log-tracing microservices with Jaeger observability
type: application
version: 1.0.0
appVersion: "1.0.0"
kubeVersion: ">= 1.28"
keywords: [kubernetes, observability, tracing, jaeger, microservices]
sources:
  - https://github.com/example/log-tracing-system
maintainers:
  - name: Platform Engineering
    email: platform@example.com
dependencies:
  - name: prometheus-community
    version: "0.x"
    repository: https://prometheus-community.github.io/helm-charts
    alias: kube-prometheus-stack
    condition: monitoring.enabled
