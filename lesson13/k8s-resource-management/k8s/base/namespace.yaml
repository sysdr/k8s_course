apiVersion: v1
kind: Namespace
metadata:
  name: log-platform
  labels:
    name: log-platform
    environment: production
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: log-platform-quota
  namespace: log-platform
spec:
  hard:
    requests.cpu: "50"
    requests.memory: "100Gi"
    limits.cpu: "100"
    limits.memory: "200Gi"
    persistentvolumeclaims: "10"
    pods: "50"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: log-platform-limits
  namespace: log-platform
spec:
  limits:
  - max:
      cpu: "8"
      memory: "16Gi"
    min:
      cpu: "100m"
      memory: "128Mi"
    type: Container
  - max:
      cpu: "16"
      memory: "32Gi"
    min:
      cpu: "200m"
      memory: "256Mi"
    type: Pod
