apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-engine
  namespace: log-platform
  labels:
    app: analytics-engine
    tier: analytics
spec:
  replicas: 2
  selector:
    matchLabels:
      app: analytics-engine
  template:
    metadata:
      labels:
        app: analytics-engine
        tier: analytics
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8002"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: analytics-engine
        image: analytics-engine:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8002
          name: http
        env:
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        resources:
          requests:
            cpu: "1000m"      # 1 CPU for complex queries
            memory: "2Gi"     # 2GB for in-memory analytics
          limits:
            cpu: "4000m"      # Can burst to 4 CPUs
            memory: "4Gi"     # 2x requests for memory-intensive operations
        livenessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8002
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-engine
  namespace: log-platform
spec:
  selector:
    app: analytics-engine
  ports:
  - port: 8002
    targetPort: 8002
    name: http
  type: ClusterIP
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: analytics-engine-vpa
  namespace: log-platform
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: analytics-engine
  updatePolicy:
    updateMode: "Initial"  # Set resources at pod creation, don't modify running pods
  resourcePolicy:
    containerPolicies:
    - containerName: analytics-engine
      minAllowed:
        cpu: "500m"
        memory: "1Gi"
      maxAllowed:
        cpu: "8000m"
        memory: "16Gi"
      controlledResources: ["cpu", "memory"]
