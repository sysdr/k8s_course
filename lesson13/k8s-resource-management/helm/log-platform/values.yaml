# Resource Management Configuration
resources:
  logIngest:
    requests:
      cpu: "1000m"
      memory: "1Gi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  
  logParser:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "768Mi"
  
  analyticsEngine:
    requests:
      cpu: "1000m"
      memory: "2Gi"
    limits:
      cpu: "4000m"
      memory: "4Gi"

# Autoscaling Configuration
autoscaling:
  logParser:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilization: 70
    targetMemoryUtilization: 80

# Namespace Resource Quotas
quota:
  requestsCpu: "50"
  requestsMemory: "100Gi"
  limitsCpu: "100"
  limitsMemory: "200Gi"

# Pod Disruption Budgets
podDisruptionBudget:
  logIngest:
    minAvailable: 2
  logParser:
    minAvailable: 2

replicaCount:
  logIngest: 3
  logParser: 3
  analyticsEngine: 2
  frontend: 2

image:
  pullPolicy: IfNotPresent
