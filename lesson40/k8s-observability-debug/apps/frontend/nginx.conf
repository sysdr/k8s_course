server {
    listen 80;
    server_name localhost;

    # Kubernetes DNS resolver
    resolver 10.96.0.10 valid=10s;
    resolver_timeout 5s;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy to log-processor API
    location /api/health {
        set $backend "log-processor.default.svc.cluster.local";
        proxy_pass http://$backend:80/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    location /api/logs/ {
        set $backend "log-processor.default.svc.cluster.local";
        proxy_pass http://$backend:80/logs/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # Proxy to Prometheus API - rewrite the path correctly
    location ~ ^/api/prometheus/(.*)$ {
        set $prometheus "kube-prometheus-kube-prome-prometheus.monitoring.svc.cluster.local";
        proxy_pass http://$prometheus:9090/api/v1/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
