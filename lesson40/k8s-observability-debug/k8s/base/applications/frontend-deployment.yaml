apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability-dashboard
  namespace: default
  labels:
    app: observability-dashboard
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: observability-dashboard
  template:
    metadata:
      labels:
        app: observability-dashboard
        component: frontend
    spec:
      containers:
      - name: frontend
        image: observability-dashboard:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: observability-dashboard
  namespace: default
  labels:
    app: observability-dashboard
    component: frontend
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  selector:
    app: observability-dashboard
