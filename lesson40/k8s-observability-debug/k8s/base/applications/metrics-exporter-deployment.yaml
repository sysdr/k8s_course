apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-exporter
  namespace: default
  labels:
    app: metrics-exporter
    component: monitoring
    team: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metrics-exporter
  template:
    metadata:
      labels:
        app: metrics-exporter
        component: monitoring
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
    spec:
      containers:
      - name: exporter
        image: metrics-exporter:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: metrics
          containerPort: 8081
          protocol: TCP
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-exporter
  namespace: default
  labels:
    app: metrics-exporter
spec:
  type: ClusterIP
  ports:
  - name: metrics
    port: 8081
    targetPort: metrics
    protocol: TCP
  selector:
    app: metrics-exporter
