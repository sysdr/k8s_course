replicaCount:
  ingestion: 3
  processor: 2
  analytics: 2
  frontend: 2

image:
  repository: ""
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: logs.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: log-platform-tls
      hosts:
        - logs.example.com

resources:
  ingestion:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi
  processor:
    limits:
      cpu: 2000m
      memory: 1Gi
    requests:
      cpu: 300m
      memory: 512Mi
  analytics:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

kafka:
  bootstrapServers: "kafka:9092"
  topic: "raw-logs"

redis:
  host: "redis"
  port: 6379

monitoring:
  prometheus:
    enabled: true
    port: 9090
  grafana:
    enabled: true
    port: 3000
