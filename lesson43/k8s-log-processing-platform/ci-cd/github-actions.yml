name: Build and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Log in to Container Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build and push log-ingestion
      uses: docker/build-push-action@v4
      with:
        context: ./services/log-ingestion
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/log-ingestion:${{ github.sha }}
    
    - name: Build and push log-processor
      uses: docker/build-push-action@v4
      with:
        context: ./services/log-processor
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/log-processor:${{ github.sha }}
    
    - name: Build and push analytics-api
      uses: docker/build-push-action@v4
      with:
        context: ./services/analytics-api
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/analytics-api:${{ github.sha }}
    
    - name: Build and push frontend
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Configure kubectl
      uses: azure/setup-kubectl@v3
    
    - name: Set kubeconfig
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config
    
    - name: Deploy to Kubernetes
      run: |
        kubectl set image deployment/log-ingestion \
          log-ingestion=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/log-ingestion:${{ github.sha }} \
          -n log-platform
        
        kubectl rollout status deployment/log-ingestion -n log-platform
