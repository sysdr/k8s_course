apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-platform-sa
  namespace: log-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: log-platform-role
  namespace: log-platform
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: log-platform-rolebinding
  namespace: log-platform
subjects:
- kind: ServiceAccount
  name: log-platform-sa
  namespace: log-platform
roleRef:
  kind: Role
  name: log-platform-role
  apiGroup: rbac.authorization.k8s.io
