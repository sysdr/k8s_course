apiVersion: v1
kind: Secret
metadata:
  name: external-api-keys
  namespace: secrets-platform
type: Opaque
stringData:
  api-key: |
    {
      "key": "REPLACE_WITH_EXTERNAL_API_KEY",
      "endpoint": "https://api.example.com"
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: oauth-tokens
  namespace: secrets-platform
type: Opaque
stringData:
  tokens: |
    {
      "access_token": "REPLACE_WITH_OAUTH_ACCESS_TOKEN",
      "refresh_token": "REPLACE_WITH_OAUTH_REFRESH_TOKEN"
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-api-service
  namespace: secrets-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: analytics-api-service
  template:
    metadata:
      labels:
        app: analytics-api-service
        version: v1
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      serviceAccountName: analytics-api-sa
      containers:
      - name: analytics-api
        image: analytics-api-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: db-credentials
          mountPath: /var/run/secrets/database
          readOnly: true
        - name: external-api
          mountPath: /var/run/secrets/external-api
          readOnly: true
        - name: oauth-tokens
          mountPath: /var/run/secrets/oauth
          readOnly: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "400m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: db-credentials
        secret:
          secretName: database-credentials
          defaultMode: 0400
      - name: external-api
        secret:
          secretName: external-api-keys
          defaultMode: 0400
      - name: oauth-tokens
        secret:
          secretName: oauth-tokens
          defaultMode: 0400
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-api-service
  namespace: secrets-platform
spec:
  selector:
    app: analytics-api-service
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: analytics-api-sa
  namespace: secrets-platform
