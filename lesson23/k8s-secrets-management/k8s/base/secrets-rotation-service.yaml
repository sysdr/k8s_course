apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-rotation-service
  namespace: secrets-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secrets-rotation-service
  template:
    metadata:
      labels:
        app: secrets-rotation-service
        version: v1
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      serviceAccountName: secrets-rotation-sa
      containers:
      - name: secrets-rotation
        image: secrets-rotation-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: VAULT_ADDR
          value: "http://vault-simulator:8080"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: secrets-rotation-service
  namespace: secrets-platform
spec:
  selector:
    app: secrets-rotation-service
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-rotation-sa
  namespace: secrets-platform
