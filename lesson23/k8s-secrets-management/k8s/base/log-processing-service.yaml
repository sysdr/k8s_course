apiVersion: v1
kind: Secret
metadata:
  name: database-credentials
  namespace: secrets-platform
type: Opaque
stringData:
  credentials: |
    {
      "username": "loguser",
      "password": "REPLACE_WITH_SECURE_PASSWORD",
      "host": "postgres",
      "port": "5432",
      "database": "logs"
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-processing-service
  namespace: secrets-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: log-processing-service
  template:
    metadata:
      labels:
        app: log-processing-service
        version: v1
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      serviceAccountName: log-processing-sa
      containers:
      - name: log-processing
        image: log-processing-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: db-credentials
          mountPath: /var/run/secrets/database
          readOnly: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "400m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: db-credentials
        secret:
          secretName: database-credentials
          defaultMode: 0400
---
apiVersion: v1
kind: Service
metadata:
  name: log-processing-service
  namespace: secrets-platform
spec:
  selector:
    app: log-processing-service
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-processing-sa
  namespace: secrets-platform
