apiVersion: v1
kind: Secret
metadata:
  name: ingestion-api-keys
  namespace: secrets-platform
type: Opaque
stringData:
  api-keys: |
    {
      "api_keys": [
        "REPLACE_WITH_GENERATED_API_KEY_1",
        "REPLACE_WITH_GENERATED_API_KEY_2"
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-ingestion-service
  namespace: secrets-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: log-ingestion-service
  template:
    metadata:
      labels:
        app: log-ingestion-service
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      serviceAccountName: log-ingestion-sa
      containers:
      - name: log-ingestion
        image: log-ingestion-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: api-keys
          mountPath: /var/run/secrets/api-keys
          readOnly: true
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: api-keys
        secret:
          secretName: ingestion-api-keys
          defaultMode: 0400
---
apiVersion: v1
kind: Service
metadata:
  name: log-ingestion-service
  namespace: secrets-platform
spec:
  selector:
    app: log-ingestion-service
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-ingestion-sa
  namespace: secrets-platform
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: log-ingestion-hpa
  namespace: secrets-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: log-ingestion-service
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: log-ingestion-pdb
  namespace: secrets-platform
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: log-ingestion-service
