# Default values for secrets-platform

namespace: secrets-platform

vault:
  replicas: 2
  image:
    repository: vault-simulator
    tag: latest
    pullPolicy: Never
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 200m

logIngestion:
  replicas: 3
  image:
    repository: log-ingestion-service
    tag: latest
    pullPolicy: Never
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPU: 70

logProcessing:
  replicas: 2
  image:
    repository: log-processing-service
    tag: latest
    pullPolicy: Never

analyticsAPI:
  replicas: 2
  image:
    repository: analytics-api-service
    tag: latest
    pullPolicy: Never

frontend:
  replicas: 2
  image:
    repository: frontend
    tag: latest
    pullPolicy: Never
  service:
    type: LoadBalancer
    port: 80

postgres:
  storageClass: standard
  storage: 5Gi
  password: REPLACE_WITH_SECURE_POSTGRES_PASSWORD
