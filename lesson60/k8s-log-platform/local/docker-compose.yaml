services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment: { ZOOKEEPER_CLIENT_PORT: 2181, ZOOKEEPER_TICK_TIME: 2000 }
    ports: ["2181:2181"]
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on: [zookeeper]
    environment: { KAFKA_BROKER_ID: 1, KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181, KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092, KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1 }
    ports: ["9092:9092"]
  postgres:
    image: postgres:15-alpine
    environment: { POSTGRES_DB: logdb, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  log-api:
    build: { context: ../services/log-api }
    environment: { KAFKA_BOOTSTRAP_SERVERS: kafka:9092, POSTGRES_HOST: postgres, POSTGRES_DB: logdb, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, REDIS_HOST: redis }
    ports: ["8000:8000"]
    depends_on: [kafka, postgres, redis]
  log-processor:
    build: { context: ../services/log-processor }
    environment: { KAFKA_BOOTSTRAP_SERVERS: kafka:9092, POSTGRES_HOST: postgres, POSTGRES_DB: logdb, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
    depends_on: [kafka, postgres]
  log-frontend:
    build:
      context: ../services/log-frontend
      args:
        REACT_APP_API_URL: http://localhost:8000
    ports: ["3000:80"]
    depends_on: [log-api]
volumes:
  postgres-data:
