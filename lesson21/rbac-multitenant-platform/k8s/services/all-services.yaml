---
apiVersion: v1
kind: Service
metadata:
  name: log-processor
  namespace: analytics
  labels:
    app: log-processor
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  selector:
    app: log-processor
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-api
  namespace: analytics
  labels:
    app: analytics-api
spec:
  type: ClusterIP
  ports:
  - port: 8001
    targetPort: 8001
    name: http
  selector:
    app: analytics-api
---
apiVersion: v1
kind: Service
metadata:
  name: audit-service
  namespace: analytics
  labels:
    app: audit-service
spec:
  type: ClusterIP
  ports:
  - port: 8002
    targetPort: 8002
    name: http
  selector:
    app: audit-service
---
apiVersion: v1
kind: Service
metadata:
  name: rbac-validator
  namespace: analytics
  labels:
    app: rbac-validator
spec:
  type: ClusterIP
  ports:
  - port: 8003
    targetPort: 8003
    name: http
  selector:
    app: rbac-validator
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: analytics
  labels:
    app: frontend
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8080
    name: http
  selector:
    app: frontend
