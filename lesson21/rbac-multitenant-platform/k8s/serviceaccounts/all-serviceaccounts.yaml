---
# Log Processor ServiceAccount - Needs to read pods and logs
apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-processor-sa
  namespace: analytics
  labels:
    app: log-processor
---
# Analytics API ServiceAccount - Needs to read deployments and services
apiVersion: v1
kind: ServiceAccount
metadata:
  name: analytics-api-sa
  namespace: analytics
  labels:
    app: analytics-api
---
# Audit Service ServiceAccount - Needs to read events
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-service-sa
  namespace: analytics
  labels:
    app: audit-service
---
# RBAC Validator ServiceAccount - Needs to create SelfSubjectAccessReviews
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rbac-validator-sa
  namespace: analytics
  labels:
    app: rbac-validator
---
# DevOps Team ServiceAccount - Broad deployment permissions
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devops-team-sa
  namespace: devops
  labels:
    team: devops
---
# Developer Team ServiceAccount - Read-only access
apiVersion: v1
kind: ServiceAccount
metadata:
  name: developer-team-sa
  namespace: developers
  labels:
    team: developers
---
# Auditor ServiceAccount - Limited read access
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auditor-sa
  namespace: auditors
  labels:
    team: auditors
