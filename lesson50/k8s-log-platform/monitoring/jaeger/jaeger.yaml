apiVersion: jaegertracing.io/v1
kind: Jaeger
metadata:
  name: log-platform-jaeger
  namespace: monitoring
spec:
  strategy: production
  storage:
    type: elasticsearch
    options:
      es:
        server-urls: http://elasticsearch:9200
  collector:
    replicas: 2
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
  query:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
  ingress:
    enabled: true
    hosts:
      - jaeger.example.com
