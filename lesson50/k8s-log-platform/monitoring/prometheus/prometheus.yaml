apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: log-platform-prometheus
  namespace: monitoring
spec:
  replicas: 2
  retention: 15d
  storage:
    volumeClaimTemplate:
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
  serviceMonitorSelector:
    matchLabels:
      monitoring: log-platform
  ruleSelector:
    matchLabels:
      monitoring: log-platform
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: 2000m
      memory: 4Gi
