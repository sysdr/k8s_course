apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: log-ingestion-monitor
  namespace: monitoring
  labels:
    monitoring: log-platform
spec:
  namespaceSelector:
    matchNames:
      - log-platform
  selector:
    matchLabels:
      app: log-ingestion
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: log-query-monitor
  namespace: monitoring
  labels:
    monitoring: log-platform
spec:
  namespaceSelector:
    matchNames:
      - log-platform
  selector:
    matchLabels:
      app: log-query
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: log-processor-monitor
  namespace: monitoring
  labels:
    monitoring: log-platform
spec:
  namespaceSelector:
    matchNames:
      - log-platform
  selector:
    matchLabels:
      app: log-processor
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
