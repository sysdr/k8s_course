apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: log-platform-ingress
  namespace: log-platform
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - logs.example.com
      secretName: log-platform-tls
  rules:
    - host: logs.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
          - path: /api/ingest
            pathType: Prefix
            backend:
              service:
                name: log-ingestion
                port:
                  number: 80
          - path: /api/logs
            pathType: Prefix
            backend:
              service:
                name: log-query
                port:
                  number: 80
