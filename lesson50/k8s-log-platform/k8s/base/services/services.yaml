apiVersion: v1
kind: Service
metadata:
  name: log-ingestion
  namespace: log-platform
  labels:
    app: log-ingestion
spec:
  selector:
    app: log-ingestion
  ports:
    - name: http
      port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: log-processor-metrics
  namespace: log-platform
  labels:
    app: log-processor
spec:
  selector:
    app: log-processor
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: log-query
  namespace: log-platform
  labels:
    app: log-query
spec:
  selector:
    app: log-query
  ports:
    - name: http
      port: 80
      targetPort: 8001
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: log-platform
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP
