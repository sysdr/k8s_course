apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-query
  namespace: log-platform
  labels:
    app: log-query
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: log-query
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 2
  template:
    metadata:
      labels:
        app: log-query
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
    spec:
      serviceAccountName: log-query
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      terminationGracePeriodSeconds: 45
      containers:
        - name: log-query
          image: log-query:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
              name: http
          env:
            - name: LOG_QUERY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: log-platform-secrets
                  key: database_url
            - name: LOG_QUERY_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: log-platform-secrets
                  key: redis_url
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
