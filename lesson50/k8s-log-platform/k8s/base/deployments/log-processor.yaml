apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-processor
  namespace: log-platform
  labels:
    app: log-processor
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: log-processor
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: log-processor
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: log-processor
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      terminationGracePeriodSeconds: 90
      containers:
        - name: log-processor
          image: log-processor:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9090
              name: metrics
          env:
            - name: LOG_PROCESSOR_KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: log-platform-config
                  key: kafka_brokers
            - name: LOG_PROCESSOR_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: log-platform-secrets
                  key: database_url
            - name: LOG_PROCESSOR_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: log-platform-secrets
                  key: redis_url
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9090
            initialDelaySeconds: 20
            periodSeconds: 15
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
