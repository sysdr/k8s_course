apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-ingestion
  namespace: log-platform
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-processor
  namespace: log-platform
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-query
  namespace: log-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: log-platform-reader
  namespace: log-platform
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: log-ingestion-reader
  namespace: log-platform
subjects:
  - kind: ServiceAccount
    name: log-ingestion
    namespace: log-platform
roleRef:
  kind: Role
  apiGroupName: rbac.authorization.k8s.io
  name: log-platform-reader
