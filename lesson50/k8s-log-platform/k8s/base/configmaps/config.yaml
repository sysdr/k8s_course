apiVersion: v1
kind: ConfigMap
metadata:
  name: log-platform-config
  namespace: log-platform
data:
  kafka_brokers: "kafka:9092"
  kafka_topic: "log-events"
  consumer_group: "log-processor-group"
  log_level: "INFO"
  max_batch_size: "1000"
---
apiVersion: v1
kind: Secret
metadata:
  name: log-platform-secrets
  namespace: log-platform
type: Opaque
stringData:
  database_url: "postgresql://loguser:logpass@postgres:5432/logdb"
  redis_url: "redis://redis:6379"
