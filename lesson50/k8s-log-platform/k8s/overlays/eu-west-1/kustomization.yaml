apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
bases:
  - ../../base
patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: log-ingestion
configMapGenerator:
  - name: log-platform-config
    behavior: merge
    literals:
      - region=eu-west-1
      - kafka_brokers=kafka-eu-west:9092
