apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
bases:
  - ../../base
patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 5
    target:
      kind: Deployment
      name: log-ingestion
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: log-processor
configMapGenerator:
  - name: log-platform-config
    behavior: merge
    literals:
      - region=us-east-1
      - kafka_brokers=kafka-us-east:9092
