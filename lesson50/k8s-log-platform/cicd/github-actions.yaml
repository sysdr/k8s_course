name: Log Platform CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/log-platform

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: loguser
          POSTGRES_PASSWORD: logpass
          POSTGRES_DB: logdb_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 3

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          for svc in log-ingestion log-processor log-query; do
            pip install -r services/$svc/requirements.txt
          done
          pip install pytest pytest-asyncio httpx

      - name: Run tests
        run: pytest tests/ -v --tb=short

  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push images
        run: |
          TAG="${{ github.sha }}"
          for svc in log-ingestion log-processor log-query; do
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --tag "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${svc}:${TAG}" \
              --tag "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${svc}:latest" \
              --push \
              services/${svc}/
          done
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${TAG}" \
            --tag "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest" \
            --push \
            frontend/

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig

      - name: Deploy to staging
        run: |
          export KUBECONFIG=/tmp/kubeconfig
          export TAG="${{ github.sha }}"
          # Update image tags in kustomization overlay
          cd k8s/overlays/us-east-1
          kustomize edit set image \
            log-ingestion="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-log-ingestion:${TAG}" \
            log-processor="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-log-processor:${TAG}" \
            log-query="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-log-query:${TAG}"
          cd ../../..
          kubectl apply -k k8s/overlays/us-east-1/
          kubectl rollout status deployment/log-ingestion -n log-platform --timeout=300s
          kubectl rollout status deployment/log-processor -n log-platform --timeout=300s
          kubectl rollout status deployment/log-query     -n log-platform --timeout=300s
