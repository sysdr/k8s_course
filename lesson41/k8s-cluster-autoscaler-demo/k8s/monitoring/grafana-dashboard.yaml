apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: log-platform
  labels:
    grafana_dashboard: "1"
data:
  log-platform.json: |
    {
      "dashboard": {
        "title": "Log Platform Dashboard",
        "tags": ["logs", "platform"],
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "Total Logs Processed",
            "type": "stat",
            "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
            "targets": [
              {
                "expr": "up{job=\"analytics-api\"}",
                "refId": "A"
              }
            ]
          },
          {
            "id": 2,
            "title": "Python GC Collections",
            "type": "graph",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
            "targets": [
              {
                "expr": "python_gc_collections_total",
                "refId": "A",
                "legendFormat": "Generation {{generation}}"
              }
            ]
          },
          {
            "id": 3,
            "title": "Process Memory",
            "type": "graph",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
            "targets": [
              {
                "expr": "process_resident_memory_bytes",
                "refId": "A",
                "legendFormat": "Resident Memory"
              },
              {
                "expr": "process_virtual_memory_bytes",
                "refId": "B",
                "legendFormat": "Virtual Memory"
              }
            ]
          }
        ],
        "time": {
          "from": "now-1h",
          "to": "now"
        },
        "refresh": "10s"
      }
    }
