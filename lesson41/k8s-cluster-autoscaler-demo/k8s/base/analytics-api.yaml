apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-api
  namespace: log-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: analytics-api
  template:
    metadata:
      labels:
        app: analytics-api
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8002"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: analytics-api
        image: analytics-api:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8002
        env:
        - name: REDIS_HOST
          value: "redis"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-api
  namespace: log-platform
spec:
  selector:
    app: analytics-api
  ports:
  - port: 8002
    targetPort: 8002
    name: http
  type: ClusterIP
