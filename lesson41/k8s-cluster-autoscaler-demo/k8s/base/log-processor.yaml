apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-processor
  namespace: log-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: log-processor
  template:
    metadata:
      labels:
        app: log-processor
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
    spec:
      containers:
      - name: log-processor
        image: log-processor:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8001
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        - name: REDIS_HOST
          value: "redis"
        resources:
          requests:
            memory: "512Mi"
            cpu: "1000m"
          limits:
            memory: "1Gi"
            cpu: "2000m"
---
apiVersion: v1
kind: Service
metadata:
  name: log-processor
  namespace: log-platform
spec:
  selector:
    app: log-processor
  ports:
  - port: 8001
    targetPort: 8001
  type: ClusterIP
