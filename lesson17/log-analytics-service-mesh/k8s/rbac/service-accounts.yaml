apiVersion: v1
kind: ServiceAccount
metadata:
  name: ingestion-api
  namespace: log-analytics
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: processing-service
  namespace: log-analytics
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: query-api
  namespace: log-analytics
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: log-analytics-role
  namespace: log-analytics
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: log-analytics-rolebinding
  namespace: log-analytics
subjects:
- kind: ServiceAccount
  name: ingestion-api
  namespace: log-analytics
- kind: ServiceAccount
  name: processing-service
  namespace: log-analytics
- kind: ServiceAccount
  name: query-api
  namespace: log-analytics
roleRef:
  kind: Role
  name: log-analytics-role
  apiGroup: rbac.authorization.k8s.io
