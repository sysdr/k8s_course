apiVersion: v1
kind: Service
metadata:
  name: ingestion-api
  namespace: log-analytics
  labels:
    app: ingestion-api
spec:
  type: ClusterIP
  selector:
    app: ingestion-api
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
---
