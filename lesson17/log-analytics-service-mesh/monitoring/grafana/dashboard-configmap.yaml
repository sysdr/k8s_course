apiVersion: v1
kind: ConfigMap
metadata:
  name: log-analytics-dashboard
  namespace: log-analytics
data:
  log-analytics.json: |
    {
      "dashboard": {
        "title": "Log Analytics Platform",
        "panels": [
          {
            "title": "Ingestion Rate",
            "targets": [
              {
                "expr": "rate(log_events_ingested_total[5m])"
              }
            ]
          },
          {
            "title": "Processing Latency",
            "targets": [
              {
                "expr": "histogram_quantile(0.99, rate(log_processing_duration_seconds_bucket[5m]))"
              }
            ]
          },
          {
            "title": "Query Response Time",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(log_query_duration_seconds_bucket[5m]))"
              }
            ]
          }
        ]
      }
    }
