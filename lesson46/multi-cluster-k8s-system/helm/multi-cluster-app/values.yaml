global:
  imageRegistry: docker.io
  imagePullSecrets: []
  
logCollector:
  replicaCount: 3
  image:
    repository: log-collector
    tag: latest
    pullPolicy: IfNotPresent
  
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilization: 70
    targetMemoryUtilization: 80
  
  podDisruptionBudget:
    enabled: true
    minAvailable: 2

logProcessor:
  replicaCount: 2
  image:
    repository: log-processor
    tag: latest
  
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

analyticsEngine:
  replicaCount: 2
  image:
    repository: analytics-engine
    tag: latest
  
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi

kafka:
  enabled: true
  replicaCount: 3
  persistence:
    enabled: true
    size: 10Gi

redis:
  enabled: true
  master:
    persistence:
      enabled: true
      size: 5Gi

monitoring:
  prometheus:
    enabled: true
  grafana:
    enabled: true
  jaeger:
    enabled: true

karmada:
  enabled: true
  clusters:
    - name: cluster-us-west
      region: us-west-2
    - name: cluster-eu-west
      region: eu-west-1
    - name: cluster-ap-southeast
      region: ap-southeast-1
