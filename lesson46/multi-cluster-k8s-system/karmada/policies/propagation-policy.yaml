apiVersion: policy.karmada.io/v1alpha1
kind: PropagationPolicy
metadata:
  name: multi-cluster-log-system
  namespace: default
spec:
  resourceSelectors:
    - apiVersion: apps/v1
      kind: Deployment
      name: log-collector
    - apiVersion: apps/v1
      kind: Deployment
      name: log-processor
    - apiVersion: apps/v1
      kind: Deployment
      name: analytics-engine
    - apiVersion: v1
      kind: Service
      name: log-collector
    - apiVersion: v1
      kind: Service
      name: log-processor
    - apiVersion: v1
      kind: Service
      name: analytics-engine
  placement:
    clusterAffinity:
      clusterNames:
        - cluster-us-west
        - cluster-eu-west
        - cluster-ap-southeast
    replicaScheduling:
      replicaDivisionPreference: Weighted
      replicaSchedulingType: Divided
      weightPreference:
        dynamicWeight: AvailableReplicas
---
apiVersion: policy.karmada.io/v1alpha1
kind: OverridePolicy
metadata:
  name: cluster-specific-config
  namespace: default
spec:
  resourceSelectors:
    - apiVersion: apps/v1
      kind: Deployment
  overrideRules:
    - targetCluster:
        clusterNames:
          - cluster-us-west
      overriders:
        plaintext:
          - path: /spec/template/spec/containers/0/env
            operator: add
            value:
              - name: CLUSTER_REGION
                value: us-west-2
    - targetCluster:
        clusterNames:
          - cluster-eu-west
      overriders:
        plaintext:
          - path: /spec/template/spec/containers/0/env
            operator: add
            value:
              - name: CLUSTER_REGION
                value: eu-west-1
    - targetCluster:
        clusterNames:
          - cluster-ap-southeast
      overriders:
        plaintext:
          - path: /spec/template/spec/containers/0/env
            operator: add
            value:
              - name: CLUSTER_REGION
                value: ap-southeast-1
