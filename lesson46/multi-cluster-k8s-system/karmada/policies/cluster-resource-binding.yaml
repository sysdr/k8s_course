apiVersion: policy.karmada.io/v1alpha1
kind: ClusterPropagationPolicy
metadata:
  name: cluster-scoped-resources
spec:
  resourceSelectors:
    - apiVersion: v1
      kind: Namespace
      name: logging-system
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
  placement:
    clusterAffinity:
      clusterNames:
        - cluster-us-west
        - cluster-eu-west
        - cluster-ap-southeast
---
apiVersion: work.karmada.io/v1alpha1
kind: ResourceBindingBehavior
metadata:
  name: graceful-eviction
spec:
  gracefulEvictionTimeout: 600
  conflictResolution: Overwrite
  dependentObjectReference:
    - apiVersion: v1
      kind: ConfigMap
    - apiVersion: v1
      kind: Secret
