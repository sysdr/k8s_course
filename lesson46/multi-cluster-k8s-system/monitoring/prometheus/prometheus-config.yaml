apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'multi-cluster-federation'
    
    scrape_configs:
      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
        - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
        - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
          action: keep
          regex: default;kubernetes;https
      
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
        - role: pod
        relabel_configs:
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
          action: keep
          regex: true
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
          action: replace
          target_label: __metrics_path__
          regex: (.+)
        - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
          action: replace
          regex: ([^:]+)(?::\d+)?;(\d+)
          replacement: $1:$2
          target_label: __address__
        - source_labels: [__meta_kubernetes_namespace]
          action: replace
          target_label: kubernetes_namespace
        - source_labels: [__meta_kubernetes_pod_name]
          action: replace
          target_label: kubernetes_pod_name
      
      - job_name: 'karmada-metrics'
        static_configs:
        - targets: ['karmada-metrics-service:8080']
          labels:
            component: 'karmada-controller'
    
    alerting:
      alertmanagers:
      - static_configs:
        - targets:
          - alertmanager:9093
    
    rule_files:
      - /etc/prometheus/rules/*.yml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring
data:
  multi-cluster-alerts.yml: |
    groups:
    - name: multi-cluster-alerts
      interval: 30s
      rules:
      - alert: ClusterUnhealthy
        expr: up{job="kubernetes-apiservers"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Cluster API server is down"
          description: "Cluster {{ $labels.cluster }} API server has been down for more than 5 minutes"
      
      - alert: HighCrossClusterLatency
        expr: histogram_quantile(0.99, rate(istio_request_duration_milliseconds_bucket{destination_cluster!="source_cluster"}[5m])) > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High cross-cluster latency detected"
          description: "99th percentile latency for cross-cluster requests is {{ $value }}ms"
      
      - alert: WorkloadImbalance
        expr: abs(count(kube_pod_info{namespace="default",pod=~"log-collector.*"}) by (cluster) - avg(count(kube_pod_info{namespace="default",pod=~"log-collector.*"}) by (cluster))) > 3
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Workload imbalance across clusters"
          description: "Pod distribution is imbalanced across federated clusters"
