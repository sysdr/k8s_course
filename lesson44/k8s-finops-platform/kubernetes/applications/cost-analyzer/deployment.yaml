apiVersion: apps/v1
kind: Deployment
metadata:
  name: cost-analyzer
  namespace: prod-logging
  labels:
    app: cost-analyzer
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cost-analyzer
  template:
    metadata:
      labels:
        app: cost-analyzer
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: cost-analyzer
        image: cost-analyzer:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8001
          name: http
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cost-analyzer-service
  namespace: prod-logging
  labels:
    app: cost-analyzer
spec:
  selector:
    app: cost-analyzer
  ports:
  - protocol: TCP
    port: 8001
    targetPort: 8001
  type: ClusterIP
