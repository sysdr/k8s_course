apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-cost-dashboard
  namespace: monitoring
data:
  cost-dashboard.json: |
    {
      "dashboard": {
        "title": "Kubernetes FinOps Cost Analysis",
        "panels": [
          {
            "title": "Cluster Hourly Cost",
            "targets": [
              {
                "expr": "sum(namespace:cpu_cost:hourly) + sum(namespace:memory_cost:hourly)"
              }
            ]
          },
          {
            "title": "Cost by Namespace",
            "targets": [
              {
                "expr": "namespace:cpu_cost:hourly + namespace:memory_cost:hourly"
              }
            ]
          },
          {
            "title": "Resource Waste Percentage",
            "targets": [
              {
                "expr": "namespace:waste_percentage"
              }
            ]
          }
        ]
      }
    }
