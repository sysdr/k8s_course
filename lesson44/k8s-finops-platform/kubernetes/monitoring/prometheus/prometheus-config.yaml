apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'finops-demo'
        environment: 'production'

    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: replace
            target_label: app

      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['kube-state-metrics:8080']

      - job_name: 'node-exporter'
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__address__]
            regex: '(.*):10250'
            replacement: '${1}:9100'
            target_label: __address__

  cost-rules.yml: |
    groups:
      - name: cost_optimization
        interval: 60s
        rules:
          - record: namespace:cpu_cost:hourly
            expr: |
              sum by (namespace) (
                kube_pod_container_resource_requests{resource="cpu", unit="core"}
              ) * 0.048

          - record: namespace:memory_cost:hourly
            expr: |
              sum by (namespace) (
                kube_pod_container_resource_requests{resource="memory", unit="byte"} / 1024 / 1024 / 1024
              ) * 0.006

          - record: namespace:waste_percentage
            expr: |
              (
                sum by (namespace) (kube_pod_container_resource_requests{resource="cpu"}) -
                sum by (namespace) (rate(container_cpu_usage_seconds_total[5m]))
              ) / 
              sum by (namespace) (kube_pod_container_resource_requests{resource="cpu"})
              * 100

      - name: cost_alerts
        interval: 60s
        rules:
          - alert: HighResourceWaste
            expr: namespace:waste_percentage > 30
            for: 6h
            labels:
              severity: warning
              team: finops
            annotations:
              summary: "High resource waste in {{ $labels.namespace }}"
              description: "Namespace {{ $labels.namespace }} has {{ $value }}% resource waste for >6 hours"

          - alert: NamespaceCostSpike
            expr: |
              (
                namespace:cpu_cost:hourly + namespace:memory_cost:hourly
              ) > 2 * avg_over_time((namespace:cpu_cost:hourly + namespace:memory_cost:hourly)[24h:])
            for: 1h
            labels:
              severity: critical
              team: finops
            annotations:
              summary: "Cost spike detected in {{ $labels.namespace }}"
              description: "Namespace {{ $labels.namespace }} cost is 2x the 24h average"
