apiVersion: v1
kind: ResourceQuota
metadata:
  name: prod-logging-quota
  namespace: prod-logging
spec:
  hard:
    requests.cpu: "20"
    requests.memory: 40Gi
    limits.cpu: "40"
    limits.memory: 80Gi
    persistentvolumeclaims: "10"
    pods: "50"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: staging-logging-quota
  namespace: staging-logging
spec:
  hard:
    requests.cpu: "5"
    requests.memory: 10Gi
    limits.cpu: "10"
    limits.memory: 20Gi
    persistentvolumeclaims: "5"
    pods: "20"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dev-logging-quota
  namespace: dev-logging
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    persistentvolumeclaims: "3"
    pods: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: resource-limits
  namespace: prod-logging
spec:
  limits:
  - max:
      cpu: "4"
      memory: 8Gi
    min:
      cpu: 100m
      memory: 128Mi
    default:
      cpu: 500m
      memory: 1Gi
    defaultRequest:
      cpu: 200m
      memory: 512Mi
    type: Container
