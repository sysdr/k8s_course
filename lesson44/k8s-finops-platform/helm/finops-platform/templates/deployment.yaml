{{- if .Values.logIngest.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "finops-platform.fullname" . }}-log-ingest
  labels:
    {{- include "finops-platform.labels" . | nindent 4 }}
    component: log-ingest
spec:
  replicas: {{ .Values.logIngest.replicaCount }}
  selector:
    matchLabels:
      {{- include "finops-platform.selectorLabels" . | nindent 6 }}
      component: log-ingest
  template:
    metadata:
      labels:
        {{- include "finops-platform.selectorLabels" . | nindent 8 }}
        component: log-ingest
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      containers:
      - name: log-ingest
        image: "{{ .Values.logIngest.image.repository }}:{{ .Values.logIngest.image.tag }}"
        imagePullPolicy: {{ .Values.logIngest.image.pullPolicy }}
        ports:
        - containerPort: 8000
        resources:
          {{- toYaml .Values.logIngest.resources | nindent 10 }}
{{- end }}
