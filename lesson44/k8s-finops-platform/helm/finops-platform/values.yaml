# Default values for finops-platform

global:
  environment: production
  costCenter: platform-engineering

logIngest:
  enabled: true
  replicaCount: 3
  image:
    repository: log-ingest
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 300m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilization: 70

costAnalyzer:
  enabled: true
  replicaCount: 2
  image:
    repository: cost-analyzer
    tag: latest
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  enabled: true
  replicaCount: 2
  image:
    repository: cost-dashboard
    tag: latest
  service:
    type: LoadBalancer
    port: 80

monitoring:
  prometheus:
    enabled: true
    retention: 15d
    storageSize: 50Gi
  grafana:
    enabled: true
    adminPassword: changeme

namespaces:
  prod:
    cpu: "20"
    memory: "40Gi"
  staging:
    cpu: "5"
    memory: "10Gi"
  dev:
    cpu: "2"
    memory: "4Gi"
