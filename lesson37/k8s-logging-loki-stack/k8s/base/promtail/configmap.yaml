apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: logging-system
data:
  promtail.yaml: |
    server:
      http_listen_port: 3101
      grpc_listen_port: 0

    positions:
      filename: /tmp/positions.yaml

    clients:
      - url: http://loki:3100/loki/api/v1/push
        batchwait: 1s
        batchsize: 1048576
        timeout: 10s

    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          # Only scrape pods in logging-system namespace
          - source_labels: [__meta_kubernetes_namespace]
            action: keep
            regex: logging-system
          
          # Extract namespace
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          
          # Extract pod name
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          
          # Extract container name
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          
          # Extract app label
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: service
          
          # Set the log path
          - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            target_label: __path__
            separator: /
            replacement: /var/log/pods/*$1/*.log

        pipeline_stages:
          # Extract log level from JSON logs
          - json:
              expressions:
                level: level
                event: event
                correlation_id: correlation_id
                timestamp: timestamp
                message: message
          
          # Add severity label
          - labels:
              level:
              severity:
          
          # Parse timestamp
          - timestamp:
              source: timestamp
              format: RFC3339
              fallback_formats:
                - RFC3339Nano
                - "2006-01-02T15:04:05.999999999Z07:00"
          
          # Output structured log
          - output:
              source: message

      # Separate scrape config for higher verbosity services
      - job_name: kubernetes-pods-verbose
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            action: keep
            regex: logging-system
          
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: (api-gateway|order-service|payment-service)
          
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: service
          
          - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            target_label: __path__
            separator: /
            replacement: /var/log/pods/*$1/*.log

    limits_config:
      readline_rate: 10000
      readline_burst: 20000
