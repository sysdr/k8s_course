apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-v2
  labels:
    app: api-gateway
    version: v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
      version: v2
  template:
    metadata:
      labels:
        app: api-gateway
        version: v2
    spec:
      containers:
      - name: api-gateway
        image: api-gateway-v2:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: PORT
          value: "8000"
        - name: REDIS_HOST
          value: "redis-service"
        - name: REDIS_PORT
          value: "6379"
        - name: ANALYTICS_SERVICE_URL
          value: "http://analytics-service:8080"
        - name: RATE_LIMITER_URL
          value: "http://rate-limiter:8080"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-v2
spec:
  selector:
    app: api-gateway
    version: v2
  ports:
  - port: 8000
    targetPort: 8000
