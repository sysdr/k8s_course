# Global settings
global:
  namespace: log-analytics
  environment: development

# Log Collector
logCollector:
  replicas: 3
  image:
    repository: log-collector
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  config:
    logLevel: info
    batchSize: 1000
    kafkaBrokers: kafka.log-analytics:9092
    kafkaTopic: raw-logs

# Log Processor
logProcessor:
  replicas: 3
  image:
    repository: log-processor
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  config:
    logLevel: info
    workers: 8
    batchSize: 500
    asyncWrites: true

# Log API
logApi:
  replicas: 2
  image:
    repository: log-api
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Database
database:
  host: postgres.log-analytics
  port: 5432
  name: logs
  # Secrets are managed separately

# Redis
redis:
  host: redis.log-analytics
  port: 6379

# Kafka
kafka:
  brokers: kafka.log-analytics:9092
  topic: raw-logs

# HPA settings
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 20
  targetCPUUtilization: 70

# PDB settings
podDisruptionBudget:
  enabled: true
  minAvailable: 1
