version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: logs
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin-password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass redis-password
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data

  kafka:
    image: wurstmeister/kafka:latest
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/kafka

  log-collector:
    build: ./src/log-collector
    environment:
      LOG_LEVEL: debug
      BATCH_SIZE: 100
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: raw-logs
      REDIS_HOST: redis
      REDIS_PASSWORD: redis-password
    ports:
      - "8081:8080"
    depends_on:
      - kafka
      - redis

  log-processor:
    build: ./src/log-processor
    environment:
      LOG_LEVEL: debug
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: raw-logs
      KAFKA_GROUP: log-processor
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: logs
      DB_USER: admin
      DB_PASSWORD: admin-password
      REDIS_HOST: redis
      REDIS_PASSWORD: redis-password
    depends_on:
      - postgres
      - kafka
      - redis

  log-api:
    build: ./src/log-api
    environment:
      LOG_LEVEL: debug
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: logs
      DB_USER: admin
      DB_PASSWORD: admin-password
      REDIS_HOST: redis
      REDIS_PASSWORD: redis-password
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis

  frontend:
    build: 
      context: ./src/frontend
      args:
        - REACT_APP_API_URL=/api
    ports:
      - "3000:80"
    depends_on:
      - log-api

volumes:
  postgres_data:
  kafka_data:
  zookeeper_data:
