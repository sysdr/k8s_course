groups:
  - name: log-analytics-alerts
    rules:
      - alert: HighLogProcessingLatency
        expr: histogram_quantile(0.95, rate(log_processing_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High log processing latency detected"
          description: "P95 latency is above 1 second"

      - alert: LogProcessingFailures
        expr: rate(logs_failed_total[5m]) > 10
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High rate of log processing failures"
          description: "More than 10 logs failing per second"

      - alert: DatabaseWriteFailures
        expr: rate(db_writes_total{status="failed"}[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Database write failures detected"
