apiVersion: v1
kind: ConfigMap
metadata:
  name: log-processor-config
  namespace: log-analytics
data:
  LOG_LEVEL: "warn"
  config.yaml: |
    processing:
      workers: 16
      batch_size: 1000
      timeout_ms: 3000
    features:
      async_writes: true
      deduplication: true
      enrichment: true
    retry:
      max_attempts: 5
      backoff_ms: 500
