apiVersion: v1
kind: ConfigMap
metadata:
  name: log-processor-config
  namespace: log-analytics
data:
  LOG_LEVEL: "debug"
  config.yaml: |
    processing:
      workers: 2
      batch_size: 50
      timeout_ms: 10000
    features:
      async_writes: false
      deduplication: false
      enrichment: true
