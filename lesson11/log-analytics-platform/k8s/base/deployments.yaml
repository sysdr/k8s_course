apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-collector
  namespace: log-analytics
  labels:
    app: log-collector
spec:
  replicas: 3
  selector:
    matchLabels:
      app: log-collector
  template:
    metadata:
      labels:
        app: log-collector
    spec:
      serviceAccountName: log-collector
      containers:
      - name: log-collector
        image: log-collector:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        # Environment variables from ConfigMap
        envFrom:
        - configMapRef:
            name: log-collector-config
        # Secrets as individual env vars
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: REDIS_PASSWORD
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: api-tokens
              key: API_KEY
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-processor
  namespace: log-analytics
  labels:
    app: log-processor
spec:
  replicas: 3
  selector:
    matchLabels:
      app: log-processor
  template:
    metadata:
      labels:
        app: log-processor
    spec:
      serviceAccountName: log-processor
      containers:
      - name: log-processor
        image: log-processor:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        # Mix of ConfigMap ref and individual env vars
        env:
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: log-processor-config
              key: LOG_LEVEL
        - name: KAFKA_BROKERS
          valueFrom:
            configMapKeyRef:
              name: log-processor-config
              key: KAFKA_BROKERS
        - name: KAFKA_TOPIC
          valueFrom:
            configMapKeyRef:
              name: log-processor-config
              key: KAFKA_TOPIC
        - name: KAFKA_GROUP
          valueFrom:
            configMapKeyRef:
              name: log-processor-config
              key: KAFKA_GROUP
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: log-processor-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: log-processor-config
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: log-processor-config
              key: DB_NAME
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: log-processor-config
              key: REDIS_HOST
        # Secrets
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: DB_PASSWORD
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: REDIS_PASSWORD
        # Volume mount for config file
        volumeMounts:
        - name: config-volume
          mountPath: /etc/config
          readOnly: true
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: config-volume
        configMap:
          name: log-processor-config
          items:
          - key: config.yaml
            path: config.yaml
---
apiVersion: apps/v1
kind: Deployment
