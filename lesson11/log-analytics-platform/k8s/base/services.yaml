apiVersion: v1
kind: Service
metadata:
  name: log-collector
  namespace: log-analytics
  labels:
    app: log-collector
spec:
  selector:
    app: log-collector
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: log-processor
  namespace: log-analytics
  labels:
    app: log-processor
spec:
  selector:
    app: log-processor
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: log-api
  namespace: log-analytics
  labels:
    app: log-api
spec:
  selector:
    app: log-api
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: log-analytics
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
    name: http
  type: LoadBalancer
