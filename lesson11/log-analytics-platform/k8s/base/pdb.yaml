apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: log-collector-pdb
  namespace: log-analytics
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: log-collector
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: log-processor-pdb
  namespace: log-analytics
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: log-processor
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: log-api-pdb
  namespace: log-analytics
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: log-api
