apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-collector
  namespace: log-analytics
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-processor
  namespace: log-analytics
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-api
  namespace: log-analytics
---
# Role for log-collector - can only access its specific secrets
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: log-collector-secrets
  namespace: log-analytics
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["redis-credentials", "api-tokens", "kafka-credentials"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["log-collector-config"]
  verbs: ["get", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: log-collector-secrets-binding
  namespace: log-analytics
subjects:
- kind: ServiceAccount
  name: log-collector
  namespace: log-analytics
roleRef:
  kind: Role
  name: log-collector-secrets
  apiGroup: rbac.authorization.k8s.io
---
# Role for log-processor - database and kafka access
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: log-processor-secrets
  namespace: log-analytics
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["database-credentials", "redis-credentials", "kafka-credentials"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["log-processor-config"]
  verbs: ["get", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: log-processor-secrets-binding
  namespace: log-analytics
subjects:
- kind: ServiceAccount
  name: log-processor
  namespace: log-analytics
roleRef:
  kind: Role
  name: log-processor-secrets
  apiGroup: rbac.authorization.k8s.io
---
# Role for log-api - read-only database access
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: log-api-secrets
  namespace: log-analytics
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["database-credentials", "redis-credentials"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["log-api-config"]
  verbs: ["get", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: log-api-secrets-binding
  namespace: log-analytics
subjects:
- kind: ServiceAccount
  name: log-api
  namespace: log-analytics
roleRef:
  kind: Role
  name: log-api-secrets
  apiGroup: rbac.authorization.k8s.io
