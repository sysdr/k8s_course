apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-processor
  namespace: logging
  labels:
    app: log-processor
    cluster: cluster-b
spec:
  replicas: 2
  selector:
    matchLabels:
      app: log-processor
  template:
    metadata:
      labels:
        app: log-processor
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: log-processor
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: log-processor
        image: log-processor:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: log-processor-config
              key: kafka_bootstrap_servers
        - name: KAFKA_TOPIC
          value: "logs"
        - name: KAFKA_GROUP_ID
          value: "log-processor-group"
        - name: POSTGRES_DSN
          valueFrom:
            secretKeyRef:
              name: log-processor-secrets
              key: postgres_dsn
        - name: CLUSTER_A_URL
          valueFrom:
            configMapKeyRef:
              name: log-processor-config
              key: cluster_a_url
        - name: CLUSTER_ID
          value: "cluster-b"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-processor
  namespace: logging
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: log-processor-config
  namespace: logging
data:
  kafka_bootstrap_servers: "kafka:9092"
  # IMPORTANT: This should be the LoadBalancer IP/DNS from Cluster A
  # Update this after deploying Cluster A and getting the LoadBalancer endpoint
  cluster_a_url: "http://<CLUSTER-A-LOADBALANCER-IP>:8000"
---
apiVersion: v1
kind: Secret
metadata:
  name: log-processor-secrets
  namespace: logging
type: Opaque
stringData:
  postgres_dsn: "postgresql://postgres:postgres@postgres:5432/logs"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: log-processor-pdb
  namespace: logging
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: log-processor
