apiVersion: v1
kind: Service
metadata:
  name: log-ingestion
  namespace: logging
  labels:
    app: log-ingestion
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: log-ingestion
---
# LoadBalancer Service for cross-cluster exposure
apiVersion: v1
kind: Service
metadata:
  name: log-ingestion-lb
  namespace: logging
  labels:
    app: log-ingestion
  annotations:
    # Cloud provider annotations for LoadBalancer configuration
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    # Health check configuration
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: "/health"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-interval: "10"
    # GCP annotations (use appropriate one based on cloud provider)
    # cloud.google.com/load-balancer-type: "Internal"
spec:
  type: LoadBalancer
  # For production, restrict source IPs to known cluster CIDRs
  # loadBalancerSourceRanges:
  # - 10.0.0.0/8  # Cluster B CIDR
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: log-ingestion
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
