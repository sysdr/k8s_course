services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"   # Use 6380 on host to avoid conflict with existing Redis on 6379

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: logs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  log-ingestion:
    build: ./cluster-a/services/log-ingestion
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_URL: redis://redis:6379
      CLUSTER_ID: cluster-a
    ports:
      - "8000:8000"
    depends_on:
      - kafka
      - redis

  log-processor:
    build: ./cluster-b/services/log-processor
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_DSN: postgresql://postgres:postgres@postgres:5432/logs
      CLUSTER_A_URL: http://log-ingestion:8000
      CLUSTER_ID: cluster-b
    ports:
      - "8001:8000"
    depends_on:
      - kafka
      - postgres
      - log-ingestion

volumes:
  postgres_data:
