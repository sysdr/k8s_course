server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /collector/ {
        proxy_pass http://log-collector:8080/;
        proxy_set_header Host $host;
    }

    location /processor/ {
        proxy_pass http://log-processor:8080/;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://analytics-api:8080/;
        proxy_set_header Host $host;
    }
}
