# Global settings
global:
  namespace: log-analytics
  imageRegistry: ""

# Log Collector configuration
logCollector:
  enabled: true
  replicas: 3
  image:
    repository: log-collector
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"
  probes:
    liveness:
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
    startup:
      initialDelaySeconds: 5
      periodSeconds: 5
      failureThreshold: 12
  terminationGracePeriodSeconds: 60

# Log Processor configuration
logProcessor:
  enabled: true
  replicas: 2
  image:
    repository: log-processor
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "1000m"
  probes:
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    startup:
      initialDelaySeconds: 10
      periodSeconds: 10
      failureThreshold: 12  # 2 minutes max for model loading
  terminationGracePeriodSeconds: 30

# Analytics API configuration
analyticsApi:
  enabled: true
  replicas: 3
  image:
    repository: analytics-api
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"
  probes:
    liveness:
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
    startup:
      initialDelaySeconds: 5
      periodSeconds: 5
      failureThreshold: 6
  terminationGracePeriodSeconds: 60
  preStopSleep: 10

# Frontend configuration
frontend:
  enabled: true
  replicas: 2
  image:
    repository: frontend
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"
  service:
    type: LoadBalancer
    port: 80

# Infrastructure
redis:
  enabled: true
  image: redis:7-alpine

kafka:
  enabled: true
  image: bitnami/kafka:3.6

# Autoscaling
autoscaling:
  analyticsApi:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  logCollector:
    enabled: true
    minReplicas: 3
    maxReplicas: 15
    targetCPUUtilizationPercentage: 70

# Pod Disruption Budgets
podDisruptionBudget:
  analyticsApi:
    minAvailable: 2
  logCollector:
    minAvailable: 2
  logProcessor:
    minAvailable: 1
