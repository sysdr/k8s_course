apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-api
  namespace: log-analytics
  labels:
    app: analytics-api
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: analytics-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # Zero downtime deployments
  template:
    metadata:
      labels:
        app: analytics-api
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: analytics-api
      # Extended grace period for connection draining
      terminationGracePeriodSeconds: 60
      containers:
      - name: analytics-api
        image: analytics-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        
        envFrom:
        - configMapRef:
            name: analytics-api-config
        
        # LIVENESS PROBE
        # Never checks database or Redis - only internal health
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        
        # READINESS PROBE
        # Checks database pool and Redis connectivity
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
          successThreshold: 1
        
        # STARTUP PROBE
        startupProbe:
          httpGet:
            path: /health/startup
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 6  # 6 * 5s = 30s max startup
          successThreshold: 1
        
        # LIFECYCLE HOOKS
        lifecycle:
          # preStop: Graceful shutdown with connection draining
          # Sleep allows load balancer to update before we stop serving
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - |
                # Signal the app to stop accepting new requests
                curl -X POST http://localhost:8080/shutdown
                # Wait for load balancer to update and connections to drain
                sleep 10
        
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-api
  namespace: log-analytics
  labels:
    app: analytics-api
spec:
  selector:
    app: analytics-api
  ports:
  - port: 8080
    targetPort: 8080
    name: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: analytics-api-config
  namespace: log-analytics
data:
  LOG_LEVEL: "INFO"
  REDIS_HOST: "redis"
  DB_POOL_SIZE: "10"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: analytics-api
  namespace: log-analytics
