apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-collector
  namespace: log-analytics
  labels:
    app: log-collector
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: log-collector
  template:
    metadata:
      labels:
        app: log-collector
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: log-collector
      terminationGracePeriodSeconds: 60
      containers:
      - name: log-collector
        image: log-collector:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        
        # Resource management
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        
        # Environment variables from ConfigMap
        envFrom:
        - configMapRef:
            name: log-collector-config
        
        # LIVENESS PROBE
        # Checks if process is fundamentally healthy
        # Only checks internal state - never external dependencies
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        
        # READINESS PROBE
        # Checks if service can handle traffic
        # Checks Kafka and Redis connectivity
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
          successThreshold: 1
        
        # STARTUP PROBE
        # Gives application time to initialize
        # Once passes, liveness/readiness probes take over
        startupProbe:
          httpGet:
            path: /health/startup
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12  # 12 * 5s = 60s max startup
          successThreshold: 1
        
        # LIFECYCLE HOOKS
        lifecycle:
          # preStop: Graceful shutdown - flush buffers before termination
          preStop:
            httpGet:
              path: /shutdown
              port: 8080
        
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: log-collector
  namespace: log-analytics
  labels:
    app: log-collector
spec:
  selector:
    app: log-collector
  ports:
  - port: 8080
    targetPort: 8080
    name: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: log-collector-config
  namespace: log-analytics
data:
  LOG_LEVEL: "INFO"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  REDIS_HOST: "redis"
  BUFFER_SIZE: "100"
  FLUSH_INTERVAL: "5"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-collector
  namespace: log-analytics
