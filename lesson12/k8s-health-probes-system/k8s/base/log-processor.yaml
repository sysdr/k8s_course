apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-processor
  namespace: log-analytics
  labels:
    app: log-processor
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: log-processor
  template:
    metadata:
      labels:
        app: log-processor
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: log-processor
      terminationGracePeriodSeconds: 30
      containers:
      - name: log-processor
        image: log-processor:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
        
        envFrom:
        - configMapRef:
            name: log-processor-config
        
        # LIVENESS PROBE
        # Only checks if process is alive, not model status
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        
        # READINESS PROBE
        # Checks if ML model is loaded and cache is warmed
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        
        # STARTUP PROBE - CRITICAL FOR SLOW STARTUP
        # Allows up to 2 minutes for ML model loading
        # Without this, liveness probe would kill container during init
        startupProbe:
          httpGet:
            path: /health/startup
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 12  # 12 * 10s = 120s max startup
          successThreshold: 1
        
        # LIFECYCLE HOOKS
        lifecycle:
          # postStart: Trigger cache warming after container starts
          postStart:
            httpGet:
              path: /cache/warm
              port: 8080
        
        volumeMounts:
        - name: model-cache
          mountPath: /app/models
      
      volumes:
      - name: model-cache
        emptyDir:
          sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: log-processor
  namespace: log-analytics
  labels:
    app: log-processor
spec:
  selector:
    app: log-processor
  ports:
  - port: 8080
    targetPort: 8080
    name: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: log-processor-config
  namespace: log-analytics
data:
  LOG_LEVEL: "INFO"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  REDIS_HOST: "redis"
  MODEL_PATH: "/app/models"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-processor
  namespace: log-analytics
