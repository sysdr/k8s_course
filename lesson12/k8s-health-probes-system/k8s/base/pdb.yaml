# Ensure analytics-api always has at least 2 pods
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: analytics-api-pdb
  namespace: log-analytics
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: analytics-api
---
# Ensure log-collector always has at least 2 pods
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: log-collector-pdb
  namespace: log-analytics
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: log-collector
---
# Ensure at least 1 log-processor is available
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: log-processor-pdb
  namespace: log-analytics
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: log-processor
