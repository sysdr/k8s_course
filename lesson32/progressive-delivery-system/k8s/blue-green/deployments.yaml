# Blue Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service-blue
  namespace: progressive-delivery
  labels:
    app: order-service
    color: blue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: order-service
      color: blue
  template:
    metadata:
      labels:
        app: order-service
        color: blue
        version: v1
    spec:
      containers:
      - name: order-service
        image: order-service:v1
        ports:
        - containerPort: 8080
        env:
        - name: VERSION
          value: "v1-blue"
        - name: PAYMENT_SERVICE_URL
          value: "http://payment-gateway:8080"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
# Green Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service-green
  namespace: progressive-delivery
  labels:
    app: order-service
    color: green
spec:
  replicas: 3
  selector:
    matchLabels:
      app: order-service
      color: green
  template:
    metadata:
      labels:
        app: order-service
        color: green
        version: v2
    spec:
      containers:
      - name: order-service
        image: order-service:v2
        ports:
        - containerPort: 8080
        env:
        - name: VERSION
          value: "v2-green"
        - name: PAYMENT_SERVICE_URL
          value: "http://payment-gateway:8080"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
# Service uses color selector
apiVersion: v1
kind: Service
metadata:
  name: order-service-bg
  namespace: progressive-delivery
spec:
  type: ClusterIP
  selector:
    app: order-service
    color: blue  # Initially points to blue
  ports:
  - port: 8080
    targetPort: 8080
