apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: progressive-delivery
data:
  progressive-delivery-dashboard.json: |
    {
      "dashboard": {
        "title": "Progressive Delivery Metrics",
        "panels": [
          {
            "title": "Request Rate by Version",
            "targets": [
              {
                "expr": "sum(rate(istio_requests_total{destination_workload_namespace=\"progressive-delivery\"}[5m])) by (destination_version)"
              }
            ]
          },
          {
            "title": "Error Rate",
            "targets": [
              {
                "expr": "sum(rate(istio_requests_total{destination_workload_namespace=\"progressive-delivery\",response_code=~\"5..\"}[5m])) / sum(rate(istio_requests_total{destination_workload_namespace=\"progressive-delivery\"}[5m])) * 100"
              }
            ]
          },
          {
            "title": "Latency p99",
            "targets": [
              {
                "expr": "histogram_quantile(0.99, sum(rate(istio_request_duration_milliseconds_bucket{destination_workload_namespace=\"progressive-delivery\"}[5m])) by (le, destination_version))"
              }
            ]
          },
          {
            "title": "Traffic Distribution",
            "targets": [
              {
                "expr": "sum(rate(istio_requests_total{destination_workload_namespace=\"progressive-delivery\"}[1m])) by (destination_version) / sum(rate(istio_requests_total{destination_workload_namespace=\"progressive-delivery\"}[1m])) * 100"
              }
            ]
          }
        ]
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: progressive-delivery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:10.2.0
        ports:
        - containerPort: 3000
        env:
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: "true"
        - name: GF_AUTH_ANONYMOUS_ORG_ROLE
          value: "Admin"
        volumeMounts:
        - name: dashboards
          mountPath: /etc/grafana/provisioning/dashboards
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: dashboards
        configMap:
          name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: progressive-delivery
spec:
  type: NodePort
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30300
  selector:
    app: grafana
