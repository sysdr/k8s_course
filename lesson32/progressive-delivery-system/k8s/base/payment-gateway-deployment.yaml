apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-gateway
  namespace: progressive-delivery
  labels:
    app: payment-gateway
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-gateway
  template:
    metadata:
      labels:
        app: payment-gateway
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: payment-gateway
      containers:
      - name: payment-gateway
        image: payment-gateway:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: VERSION
          value: "v1"
        - name: SUCCESS_RATE
          value: "0.95"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: payment-gateway
  namespace: progressive-delivery
  labels:
    app: payment-gateway
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: payment-gateway
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-gateway
  namespace: progressive-delivery
