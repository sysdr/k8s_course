apiVersion: v1
kind: ConfigMap
metadata:
  name: flagger-prometheus-rules
  namespace: progressive-delivery
data:
  rules.yaml: |
    groups:
    - name: canary
      interval: 1m
      rules:
      - record: request_success_rate
        expr: |
          sum(
            rate(
              istio_requests_total{
                reporter="destination",
                destination_workload_namespace="progressive-delivery",
                response_code!~"5.*"
              }[1m]
            )
          )
          /
          sum(
            rate(
              istio_requests_total{
                reporter="destination",
                destination_workload_namespace="progressive-delivery"
              }[1m]
            )
          )
          * 100
      
      - record: request_duration
        expr: |
          histogram_quantile(0.99,
            sum(
              rate(
                istio_request_duration_milliseconds_bucket{
                  reporter="destination",
                  destination_workload_namespace="progressive-delivery"
                }[1m]
              )
            ) by (le)
          )
