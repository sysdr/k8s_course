---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-ingestion-sa
  namespace: log-processing
  annotations:
    app.kubernetes.io/component: log-ingestion
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: log-ingestion-role
  namespace: log-processing
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: log-ingestion-rolebinding
  namespace: log-processing
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: log-ingestion-role
subjects:
  - kind: ServiceAccount
    name: log-ingestion-sa
    namespace: log-processing
