---
# Allow ingress to log-ingestion only from istio-ingress and aggregator
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: log-ingestion-netpol
  namespace: log-processing
spec:
  podSelector:
    matchLabels:
      app: log-ingestion
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
        - podSelector:
            matchLabels:
              app: aggregator
      ports:
        - port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - port: 9092
    - to: []  # DNS
      ports:
        - port: 53
          protocol: UDP
---
# Log processor: only to kafka and postgres
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: log-processor-netpol
  namespace: log-processing
spec:
  podSelector:
    matchLabels:
      app: log-processor
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - port: 9092
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
    - to: []
      ports:
        - port: 53
          protocol: UDP
