apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: log-ingestion-authz
  namespace: log-processing
spec:
  selector:
    matchLabels:
      app: log-ingestion
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"
              - "cluster.local/ns/log-processing/sa/aggregator-sa"
      to:
        - operation:
            methods: ["POST"]
            paths: ["/ingest", "/ingest/batch"]
    - from:
        - source:
            principals: ["cluster.local/ns/monitoring/sa/prometheus-sa"]
      to:
        - operation:
            methods: ["GET"]
            paths: ["/metrics", "/health/*"]
