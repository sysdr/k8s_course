apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: log-platform-gateway
  namespace: log-processing
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "logs.example.com"
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: log-platform-tls
      hosts:
        - "logs.example.com"
