apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: log-ingestion-dr
  namespace: log-processing
spec:
  host: log-ingestion
  trafficPolicy:
    loadBalancer:
      simple: LEAST_CONN
      localityLbSetting:
        enabled: true
        failover:
          - from: us-east
            to:   eu-west
          - from: eu-west
            to:   us-east
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        h2UpgradePolicy:     UPGRADE
        http1MaxPendingRequests: 200
        http2MaxRequests:        1000
    outlierDetection:
      consecutiveGatewayErrors: 5
      interval:               10s
      baseEjectionTime:       30s
      maxEjectionPercent:     50
      minHealthPercent:       30
  subsets:
    - name: v1
      labels:
        version: v1
