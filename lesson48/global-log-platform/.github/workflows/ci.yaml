name: CI — Build & Validate

on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps & lint
        run: |
          pip install ruff mypy pytest pytest-asyncio
          ruff check services/
          mypy services/ --ignore-missing-imports

      - name: Run unit tests
        run: pytest services/ -v --tb=short

  validate-k8s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Kubernetes manifests
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary k8s/base/
          ./kubeconform -strict -summary k8s/istio/

      - name: Lint Helm chart
        run: |
          helm lint helm/log-platform/
          helm template log-platform helm/log-platform/ --dry-run

  build-and-push:
    runs-on: ubuntu-latest
    needs: [lint-and-test, validate-k8s]
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [log-ingestion, log-processor, aggregator]
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
