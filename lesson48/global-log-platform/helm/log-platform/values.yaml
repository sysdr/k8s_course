global:
  region:    "us-east"
  imageRegistry: ""
  imagePullSecrets: []

logIngestion:
  replicaCount: 3
  image:
    repository: log-ingestion
    tag:        latest
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: "250m", memory: "256Mi" }
    limits:   { cpu: "1000m", memory: "512Mi" }
  hpa:
    enabled:            true
    minReplicas:        3
    maxReplicas:        12
    targetCPUPercent:   60
    targetMemPercent:   75
  pdb:
    enabled:      true
    minAvailable: 2

logProcessor:
  replicaCount: 2
  image:
    repository: log-processor
    tag:        latest
  vpa:
    enabled: true

aggregator:
  replicaCount: 2
  image:
    repository: aggregator
    tag:        latest
  usEastEndpoint: "http://log-ingestion.us-east.svc.cluster.local:8000"
  euWestEndpoint: "http://log-ingestion.eu-west.svc.cluster.local:8000"

kafka:
  replicaCount:   3
  storageSize:    "10Gi"
  retentionHours: 24

postgres:
  storageSize: "20Gi"
  database:    "logsdb"
  username:    "logs"

istio:
  enabled:          true
  mtlsMode:         "STRICT"
  localityFailover:
    enabled: true
    primary: "us-east"
    secondary: "eu-west"

monitoring:
  prometheus:
    enabled: true
    retention: "15d"
  grafana:
    enabled: true
    adminPassword: "changeme"
  jaeger:
    enabled:  true
    strategy: "production"
